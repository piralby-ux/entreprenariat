<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #n-rim { position: absolute; inset: 0; }
    #n-world { position: absolute; inset: 0; background: #ede6da; }
    #n-cam { position: absolute; inset: 0; transform-origin: 540px 960px; }
    #n-push { position: absolute; inset: 0; transform-origin: 540px 900px; }
    .n-abs { position: absolute; display: block; }
    #n-shade { opacity: 0; }
    .n-cut { position: absolute; inset: 0; background: #ede6da; overflow: hidden; visibility: hidden; }
    .n-cut img { position: absolute; transform-origin: 0 0; }
    #n-flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
    #n-machine { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
  </style>
  <div id="root" data-composition-id="aiguille" data-width="1080" data-height="1920">
    <!-- bord d'encre de la révélation (sous le nouveau monde) -->
    <svg id="n-rim" width="1080" height="1920" viewBox="0 0 1080 1920"><path id="n-rim-path" d="" fill="#121110" /></svg>
    <div id="n-world">
      <div id="n-cam">
        <div id="n-push">
          <svg class="n-abs" width="1080" height="1920" viewBox="0 0 1080 1920" style="left:0;top:0;overflow:visible">
            <defs>
              <mask id="n-mask" maskUnits="userSpaceOnUse" x="-100" y="-100" width="900" height="1520">
                <g id="n-mask-g"></g>
                <rect id="n-mask-full" x="-100" y="-100" width="900" height="1520" fill="#fff" opacity="0" />
              </mask>
              <filter id="n-bleed" x="-5%" y="-5%" width="110%" height="110%">
                <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="9" result="n" />
                <feDisplacementMap id="n-bleed-d" in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" />
              </filter>
            </defs>
            <g transform="translate(205 262) scale(0.9)">
              <image id="n-shade" href="assets/img/flashC_shade.png" width="700" height="1320" />
              <g id="n-lines-g" filter="url(#n-bleed)">
                <image href="assets/img/flashC_lines.png" width="700" height="1320" mask="url(#n-mask)" />
              </g>
            </g>
            <g id="n-splats"></g>
          </svg>
          <!-- machine rotative type stylo, dessinée à l'horizontale, pointe en (0,0) -->
          <svg id="n-machine" viewBox="0 0 1080 1920">
            <defs>
              <filter id="n-shadow-f" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" /></filter>
              <linearGradient id="n-body-g" x1="0" y1="-1" x2="0" y2="1" gradientUnits="objectBoundingBox">
                <stop offset="0" stop-color="#2b2927" /><stop offset="0.28" stop-color="#3a3734" /><stop offset="0.55" stop-color="#151413" /><stop offset="1" stop-color="#0d0c0c" />
              </linearGradient>
            </defs>
            <g id="n-mshadow" opacity="0.26" filter="url(#n-shadow-f)">
              <path d="M0 0 L70 -9 L150 -11 L150 -17 L330 -17 L330 -21 L640 -21 L640 21 L330 21 L330 17 L150 17 L150 11 L70 9 Z" fill="#121110" />
              <path d="M640 0 C760 0 820 40 1300 60" stroke="#121110" stroke-width="10" fill="none" />
            </g>
            <g id="n-mbody">
              <path d="M640 0 C760 0 830 30 1300 40" stroke="#141312" stroke-width="9" fill="none" stroke-linecap="round" />
              <line x1="0" y1="0" x2="30" y2="0" stroke="#6e6a64" stroke-width="1.8" stroke-linecap="round" />
              <path d="M24 -3 L72 -9.5 L72 9.5 L24 3 Z" fill="#2a2826" opacity="0.88" />
              <rect x="72" y="-11.5" width="80" height="23" rx="3" fill="url(#n-body-g)" />
              <rect x="144" y="-12" width="5" height="24" fill="#c2381f" />
              <rect x="152" y="-17" width="180" height="34" rx="6" fill="url(#n-body-g)" />
              <g stroke="#3d3a37" stroke-width="1.4">
                <line x1="170" y1="-15" x2="170" y2="15" /><line x1="182" y1="-15" x2="182" y2="15" /><line x1="194" y1="-15" x2="194" y2="15" />
                <line x1="206" y1="-15" x2="206" y2="15" /><line x1="218" y1="-15" x2="218" y2="15" /><line x1="230" y1="-15" x2="230" y2="15" />
                <line x1="242" y1="-15" x2="242" y2="15" /><line x1="254" y1="-15" x2="254" y2="15" /><line x1="266" y1="-15" x2="266" y2="15" />
              </g>
              <rect x="330" y="-21.5" width="290" height="43" rx="9" fill="url(#n-body-g)" />
              <rect x="468" y="-22" width="3" height="44" fill="#2e2c29" />
              <rect x="618" y="-16" width="26" height="32" rx="6" fill="#1b1a19" />
              <line x1="345" y1="-12" x2="605" y2="-12" stroke="#d9cfbf" stroke-width="2.2" opacity="0.22" stroke-linecap="round" />
              <line x1="165" y1="-9" x2="320" y2="-9" stroke="#d9cfbf" stroke-width="1.6" opacity="0.16" stroke-linecap="round" />
            </g>
          </svg>
        </div>
      </div>
      <!-- match cuts rythmés, un toutes les 0,3 s à partir de 11,4 s -->
      <div id="n-c1" class="n-cut"><img src="assets/img/flashC_shade.png" /><img src="assets/img/flashC_lines.png" /></div>
      <div id="n-c2" class="n-cut"><img src="assets/img/flashB_full.png" /></div>
      <div id="n-c3" class="n-cut"><img src="assets/img/flashA_ink.png" /></div>
      <div id="n-c4" class="n-cut"><img src="assets/img/flashB_full.png" /></div>
      <div id="n-c5" class="n-cut"><img src="assets/img/croquisB_page.jpg" style="mix-blend-mode:multiply" /></div>
      <div id="n-flash"></div>
    </div>
  </div>
  <script>
    (function () {
      const K = InkKit, $ = (s) => document.querySelector(s);
      const T0 = 8.4;
      const tl = gsap.timeline({ paused: true });
      const OX = 205, OY = 262, SC = 0.9; // repère du flash C -> écran
      const toScreen = (p) => [OX + SC * p[0], OY + SC * p[1]];

      /* ---------- ordre du tracé : contour du vase, puis fleurs et longues herbes depuis le col ---------- */
      const tr = new K.TraceReveal($("#n-mask-g"), JINKX.flashC.polys, { width: 13 });
      tr.ease = K.ease("power2.inOut");
      const VASE = [247, 432, 462, 858], MOUTH = [352, 452];
      const inVase = (it) => { const cx = (it.bbox[0] + it.bbox[2]) / 2, cy = (it.bbox[1] + it.bbox[3]) / 2; return cx > VASE[0] && cx < VASE[2] && cy > VASE[1] && cy < VASE[3]; };
      const vase = [], rest = [];
      tr.items.forEach((it, i) => (inVase(it) ? vase : rest).push(i));
      vase.sort((a, b) => tr.items[a].bbox[1] - tr.items[b].bbox[1]);
      const dist = (it) => { const cx = (it.bbox[0] + it.bbox[2]) / 2, cy = (it.bbox[1] + it.bbox[3]) / 2; return Math.hypot(cx - MOUTH[0], (cy - MOUTH[1]) * (cy > MOUTH[1] ? 0.8 : 1.2)); };
      rest.sort((a, b) => dist(tr.items[a]) - dist(tr.items[b]));
      const Lmax = Math.max(...tr.items.map((it) => it.L));
      const sched = {};
      vase.forEach((i, r) => (sched[i] = [0.45 + 0.3 * (r / Math.max(1, vase.length)), 0.32]));
      rest.forEach((i, r) => {
        const it = tr.items[i];
        const s = 0.95 + 1.0 * Math.pow(r / rest.length, 0.85);
        const d = Math.min(0.3 + 1.1 * Math.sqrt(it.L / Lmax), 2.4 - s);
        sched[i] = [s, Math.max(0.12, d)];
      });
      tr.schedule((it, i) => sched[i]);
      tl.fromTo("#n-mask-full", { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.3, ease: "power2.inOut" }, 2.25);
      // les dégradés gris arrivent comme un ombrage
      tl.fromTo("#n-shade", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 2.4);

      /* ---------- trajectoire de l'aiguille : tête du trait principal en cours, lissée (précalculée) ---------- */
      const F0 = 0.45, F1 = 2.4, N = Math.round((F1 - F0) * 30);
      const traj = [];
      let cur = null;
      for (let f = 0; f <= N; f++) {
        const t = F0 + f / 30;
        let best = null;
        for (const it of tr.items) { const p = tr.progress(it, t); if (p > 0.02 && p < 0.98 && (!best || it.L > best.L)) best = it; }
        const target = best ? toScreen(tr.head(best, t)) : cur || toScreen(MOUTH);
        cur = cur ? [cur[0] + (target[0] - cur[0]) * 0.45, cur[1] + (target[1] - cur[1]) * 0.45] : target;
        traj.push(cur);
      }
      const trajAt = (t) => { const u = K.clamp((t - F0) * 30, 0, N); const i = Math.floor(u), f = u - i; const a = traj[i], b = traj[Math.min(N, i + 1)]; return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]; };
      // éclaboussures d'encre minuscules près de l'aiguille
      const rnd = K.mulberry32(77), splats = [];
      for (let f = 2; f < N; f += 3) {
        if (rnd() < 0.55) continue;
        const p = traj[f], a = rnd() * 6.283, r = 7 + rnd() * 16;
        splats.push({ t: F0 + f / 30, x: p[0] + Math.cos(a) * r, y: p[1] + Math.sin(a) * r, s: 1.2 + rnd() * 2.6 });
      }
      const sg = $("#n-splats");
      const pool = [];
      for (let i = 0; i < 14; i++) { const c = document.createElementNS("http://www.w3.org/2000/svg", "circle"); c.setAttribute("fill", "#121110"); c.setAttribute("r", "0"); sg.appendChild(c); pool.push(c); }

      /* ---------- match cuts : chaque sujet centré au même point (540, 880) ---------- */
      const cuts = [
        { el: "#n-c1", at: 3.0, w: 700, h: 1320, cx: 352, cy: 640, s: 1.75 },
        { el: "#n-c2", at: 3.3, w: 692, h: 785, cx: 340, cy: 400, s: 1.3 },
        { el: "#n-c3", at: 3.6, w: 702, h: 1065, cx: 330, cy: 560, s: 1.25 },
        { el: "#n-c4", at: 3.9, w: 692, h: 785, cx: 345, cy: 215, s: 3.3 },
        { el: "#n-c5", at: 4.2, w: 770, h: 1095, cx: 205, cy: 470, s: 2.5 },
      ];
      cuts.forEach((c) => {
        c.node = $(c.el);
        c.imgs = [...c.node.querySelectorAll("img")];
        c.imgs.forEach((im) => { im.style.width = c.w + "px"; im.style.height = c.h + "px"; });
        tl.set(c.node, { visibility: "visible" }, c.at);
        tl.set(c.node, { visibility: "hidden" }, c.at + 0.3);
      });
      // léger flash papier (+5 %, 2 frames) sur chaque coupe
      [3.0, 3.3, 3.6, 3.9, 4.2, 4.5].forEach((a) => {
        tl.set("#n-flash", { opacity: 0.09 }, a);
        tl.set("#n-flash", { opacity: 0 }, a + 2 / 30);
      });

      const world = $("#n-world"), rim = $("#n-rim-path"), cam = $("#n-cam"), push = $("#n-push");
      const mbody = $("#n-mbody"), mshadow = $("#n-mshadow"), bleed = $("#n-bleed-d"), linesG = $("#n-lines-g");
      const RIV = [473, 913];
      const MACH_ANGLE = -52;

      K.ticker(tl, 5.4, (t) => {
        const tg = T0 + t;
        // révélation à l'encre depuis le rivet de l'éventail (8,4 -> 8,85)
        const R = K.tw(t, 0, 0.45, 0, 2300, "power2.in");
        if (R < 2250) {
          world.style.clipPath = `path('${K.blobPath(RIV[0], RIV[1], Math.max(0.1, R), 31, 0.14)}')`;
          rim.setAttribute("d", K.blobPath(RIV[0], RIV[1], R * 1.025 + 12, 32, 0.16));
          rim.parentNode.style.visibility = "visible";
        } else {
          world.style.clipPath = "none";
          rim.parentNode.style.visibility = "hidden";
        }
        // caméra : plongée (1.12 -> 1.0), puis push-in lent 1.00 -> 1.06
        K.applyCam(cam, tg, K.tw(t, 0, 0.7, 1.12, 1, "expo.out"));
        push.style.transform = `scale(${(1 + 0.06 * K.clamp(t / 3.0)).toFixed(5)})`;

        // tracé
        tr.render(t);
        const b = 5 * (1 - K.clamp((t - 2.0) / 0.6));
        if (b > 0.05) { linesG.setAttribute("filter", "url(#n-bleed)"); bleed.setAttribute("scale", b.toFixed(2)); } else linesG.removeAttribute("filter");

        // machine : entre par la droite, suit la tête du tracé, ressort
        let tip;
        const start = traj[0], end = traj[N];
        const off = [1250, 520];
        if (t < F0) { const k = K.tw(t, 0.12, F0 - 0.12, 0, 1, "power4.out"); tip = [off[0] + (start[0] - off[0]) * k, off[1] + (start[1] - off[1]) * k]; }
        else if (t <= F1) tip = trajAt(t);
        else { const k = K.tw(t, F1 + 0.15, 0.4, 0, 1, "power3.in"); tip = [end[0] + (1350 - end[0]) * k, end[1] + (300 - end[1]) * k]; }
        // vibration ±1 px à 30 Hz pendant le tracé
        const fr = Math.round(tg * 30);
        const on = t > F0 - 0.05 && t < F1 + 0.1;
        const jx = on ? (K.hash(fr * 3 + 1) * 2 - 1) : 0, jy = on ? (K.hash(fr * 3 + 2) * 2 - 1) : 0;
        const lift = t < F0 ? 1 : t > F1 ? 1 : 0;
        mbody.setAttribute("transform", `translate(${(tip[0] + jx).toFixed(2)} ${(tip[1] + jy).toFixed(2)}) rotate(${MACH_ANGLE})`);
        mshadow.setAttribute("transform", `translate(${(tip[0] + 10 + 30 * lift).toFixed(2)} ${(tip[1] + 14 + 30 * lift).toFixed(2)}) rotate(${MACH_ANGLE + 7})`);
        // éclaboussures (apparaissent puis disparaissent en 0,25 s)
        let k = 0;
        for (const s of splats) {
          const age = t - s.t;
          if (age < 0 || age > 0.25 || k >= pool.length) continue;
          const c = pool[k++];
          c.setAttribute("cx", s.x.toFixed(1)); c.setAttribute("cy", s.y.toFixed(1));
          c.setAttribute("r", (s.s * Math.min(1, age / 0.04)).toFixed(2));
          c.setAttribute("opacity", (0.85 * (1 - age / 0.25)).toFixed(3));
        }
        for (; k < pool.length; k++) pool[k].setAttribute("r", "0");

        // match cuts : micro-zoom 1.04 -> 1.0 sur chaque plan
        for (const c of cuts) {
          if (t < c.at || t >= c.at + 0.3) continue;
          const z = c.s * K.tw(t, c.at, 0.3, 1.045, 1, "power4.out");
          const tx = 540 - c.cx * z, ty = 880 - c.cy * z;
          c.imgs.forEach((im) => (im.style.transform = `translate(${tx.toFixed(1)}px, ${ty.toFixed(1)}px) scale(${z.toFixed(4)})`));
        }
      });
      window.__timelines["aiguille"] = tl;
    })();
  </script>
</template>
