<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #p-bg { position: absolute; inset: 0; background: #ede6da; visibility: hidden; }
    #p-ink { position: absolute; inset: 0; }
    #p-world { position: absolute; inset: 0; background: #ede6da; }
    #p-cam { position: absolute; inset: 0; transform-origin: 540px 960px; }
    #p-push { position: absolute; inset: 0; transform-origin: 600px 820px; background: #ede6da; }
    .p-abs { position: absolute; display: block; }
    #p-label { position: absolute; left: 92px; top: 286px; font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 28px;
      letter-spacing: 0.15em; color: #6e6a64; white-space: pre; }
    #p-print { position: absolute; left: 112px; top: 640px; width: 538px; height: 774px; padding: 24px 24px 24px 24px; background: #f7f3ec;
      box-shadow: 0 26px 46px rgba(18,17,16,0.30), 0 4px 10px rgba(18,17,16,0.22); transform-origin: 50% 50%; }
    #p-photo { position: relative; width: 490px; height: 726px; overflow: hidden; }
    #p-photo img { position: absolute; left: 0; top: 0; width: 490px; height: 726px; }
    #p-tribal { -webkit-mask-image: linear-gradient(to bottom, #000 calc(var(--fill, 0) * 1%), transparent calc(var(--fill, 0) * 1% + 7%));
      mask-image: linear-gradient(to bottom, #000 calc(var(--fill, 0) * 1%), transparent calc(var(--fill, 0) * 1% + 7%)); }
    #p-sheen { position: absolute; inset: 24px; background: linear-gradient(125deg, rgba(255,255,255,0) 40%, rgba(255,255,255,0.10) 52%, rgba(255,255,255,0) 64%); }
  </style>
  <div id="root" data-composition-id="peau" data-width="1080" data-height="1920">
    <div id="p-bg"></div>
    <svg id="p-ink" width="1080" height="1920" viewBox="0 0 1080 1920"><path id="p-ink-path" d="" fill="#121110" /></svg>
    <div id="p-world">
      <div id="p-cam">
        <div id="p-push">
          <!-- Peau 1 : la silhouette de bras (écran Procreate recadré), le tatouage ornemental se trace -->
          <img class="p-abs" src="assets/img/peau1_base.jpg" style="left:46px; top:230px; width:988px; height:1463px; mix-blend-mode:multiply" />
          <svg class="p-abs" width="1080" height="1920" viewBox="0 0 1080 1920" style="left:0; top:0; overflow:visible">
            <defs>
              <mask id="p-mask" maskUnits="userSpaceOnUse" x="-50" y="-50" width="900" height="1300">
                <g id="p-mask-g"></g>
                <g id="p-dots"></g>
                <rect id="p-mask-full" x="-50" y="-50" width="900" height="1300" fill="#fff" opacity="0" />
              </mask>
              <filter id="p-bleed" x="-5%" y="-5%" width="110%" height="110%">
                <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="13" result="n" />
                <feDisplacementMap id="p-bleed-d" in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G" />
              </filter>
            </defs>
            <g transform="translate(46 230) scale(1.25)">
              <g id="p-tat-g" filter="url(#p-bleed)">
                <image href="assets/img/peau1_tattoo.png" width="790" height="1170" mask="url(#p-mask)" />
              </g>
            </g>
          </svg>
          <!-- Peau 2 : tirage photo du mockup néo-tribal, posé sur la table -->
          <div id="p-print">
            <div id="p-photo">
              <img src="assets/img/peau2_base.jpg" />
              <img id="p-tribal" src="assets/img/peau2_tribal.png" />
            </div>
            <div id="p-sheen"></div>
          </div>
        </div>
        <div id="p-label">SUR PEAU</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const K = InkKit, $ = (s) => document.querySelector(s);
      const T0 = 13.2;
      const tl = gsap.timeline({ paused: true });

      /* tracé du tatouage ornemental (13,8 -> 15,0) */
      const tr = new K.TraceReveal($("#p-mask-g"), JINKX.peau1.polys, { width: 15 });
      tr.ease = K.ease("power2.inOut");
      const order = tr.items.map((it, i) => [it.bbox[1], i]).sort((a, b) => a[0] - b[0]);
      order.forEach(([, i], r) => { const it = tr.items[i]; const s = 0.6 + 0.45 * (r / order.length); tr.items[i].start = s; tr.items[i].dur = Math.min(1.8 - s, 0.45 + 0.004 * it.L); });
      tl.fromTo("#p-mask-full", { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.3 }, 2.45);

      /* les petits points apparaissent un par un, sur la grille rythmique (double-croches à 100 BPM) */
      const dots = JINKX.peau1dots.dots.slice().sort((a, b) => a[1] - b[1]);
      const clusters = [];
      for (const d of dots) {
        const c = clusters.find((c) => Math.hypot(c.x - d[0], c.y - d[1]) < 34);
        if (c) c.dots.push(d); else clusters.push({ x: d[0], y: d[1], dots: [d] });
      }
      const dg = $("#p-dots");
      const dotEls = [];
      clusters.forEach((c, ci) => {
        const at = 1.2 + 0.15 * Math.min(8, ci);
        c.dots.forEach((d, di) => {
          const el = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          el.setAttribute("cx", d[0]); el.setAttribute("cy", d[1]); el.setAttribute("r", 0); el.setAttribute("fill", "#fff");
          dg.appendChild(el);
          dotEls.push({ el, r: d[2] + 3, at: at + di * 0.05 });
        });
      });

      /* micro-label */
      K.typeIn(tl, K.splitLetters($("#p-label")), 0.75, 0.04);

      const world = $("#p-world"), ink = $("#p-ink-path"), bg = $("#p-bg"), cam = $("#p-cam"), push = $("#p-push");
      const print = $("#p-print"), tribal = $("#p-tribal"), bleed = $("#p-bleed-d"), tatG = $("#p-tat-g");
      const C = [540, 900];

      K.ticker(tl, 4.8, (t) => {
        const tg = T0 + t;
        // 13,2 : l'encre du vase coule vers le bas et révèle la peau
        if (t < 0.62) {
          const front = K.tw(t, 0, 0.62, -260, 2500, "power2.in");
          ink.setAttribute("d", K.dripPath(front, 1080, 7, 1));
          world.style.clipPath = `path('${K.dripPath(front - 240, 1080, 7, 0.7)}')`;
          bg.style.visibility = "hidden";
        } else if (t < 4.2) {
          ink.setAttribute("d", "");
          world.style.clipPath = "none";
          bg.style.visibility = "visible";
        } else {
          // 17,4 -> 18,0 : toute l'encre se rétracte en un point, puis disparaît
          const R = K.tw(t, 4.2, 0.55, 1500, 0, "power3.in");
          world.style.clipPath = `path('${K.blobPath(C[0], C[1], Math.max(0.1, R), 51, 0.13)}')`;
          const rr = R > 0.5 ? R * 1.02 + 14 : K.tw(t, 4.75, 0.05, 22, 0, "power2.in");
          ink.setAttribute("d", rr > 0.3 ? K.blobPath(C[0], C[1], rr, 51, 0.14) : "");
          bg.style.visibility = "visible";
        }
        const z = t < 4.2 ? 1 : K.tw(t, 4.2, 0.6, 1, 0.82, "power3.in");
        K.applyCam(cam, tg, z);
        push.style.transform = `scale(${(1 + 0.06 * K.clamp(t / 4.2)).toFixed(5)})`;

        tr.render(t);
        for (const d of dotEls) {
          const p = K.clamp((t - d.at) / 0.12);
          d.el.setAttribute("r", (d.r * K.ease("power4.out")(p)).toFixed(2));
        }
        const b = 6 * (1 - K.clamp((t - 0.6) / 1.5));
        if (b > 0.05) { tatG.setAttribute("filter", "url(#p-bleed)"); bleed.setAttribute("scale", b.toFixed(2)); } else tatG.removeAttribute("filter");

        // 15,6 : le tirage glisse depuis le bas et se pose (−4°)
        const k = K.tw(t, 2.4, 0.6, 0, 1, "power4.out");
        const y = (1 - k) * 1250, rot = -4 - 7 * (1 - k), sc = 1 + 0.035 * (1 - K.tw(t, 2.4, 0.75, 0, 1, "power2.out"));
        print.style.transform = `translate(0px, ${y.toFixed(1)}px) rotate(${rot.toFixed(3)}deg) scale(${sc.toFixed(4)})`;
        print.style.visibility = t < 2.4 ? "hidden" : "visible";
        // le tribal se remplit d'encre de haut en bas (16,2 -> 17,4)
        tribal.style.setProperty("--fill", K.tw(t, 3.0, 1.2, -8, 101, "power2.inOut").toFixed(2));
      });
      window.__timelines["peau"] = tl;
    })();
  </script>
</template>
