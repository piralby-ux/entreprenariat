  <script>
    (function () {
      const K = InkKit;
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);
      // spirale métal : anneaux sur le bord de reliure
      $("#c-spiral").innerHTML = K.spiralRings();

      const cam = $("#c-cam"), nb = $("#c-nb"), cover = $("#c-cover");
      const shade = $("#c-pageshade"), frontShade = $("#c-front-shade"), backShade = $("#c-back-shade");
      // (valeurs calculées directement depuis t : respiration, ouverture de la couverture à 0,6 s, plongée caméra)
      K.ticker(tl, 2.4, (t) => {
        const st = {
          breath: 1,
          // dès la frame 0 : la caméra descend sur le carnet (1.15 -> 1) ; la couverture s'ouvre à 0,3 s
          ang: K.tw(t, 0.3, 0.5, 0, 180, "expo.out"),
          zoom: t < 0.9 ? K.tw(t, 0, 0.9, 1.15, 1, "power3.out") : K.tw(t, 0.9, 1.5, 1, 1080 / 640, "expo.inOut"),
        };
        K.applyCam(cam, t, st.zoom);
        nb.style.transform = `scale(${st.breath.toFixed(5)})`;
        const a = st.ang;
        cover.style.transform = `rotateY(${(-a).toFixed(3)}deg)`;
        const rad = (a * Math.PI) / 180;
        // ombre portée de la couverture qui balaie la page vers la reliure
        const c = Math.max(0, Math.cos(rad));
        shade.style.width = (640 * c).toFixed(1) + "px";
        shade.style.opacity = a < 1 ? 0 : (0.95 * c * Math.min(1, a / 8)).toFixed(3);
        frontShade.style.opacity = Math.min(1, Math.sin(rad) * 1.2).toFixed(3);
        backShade.style.opacity = (0.25 + 0.75 * Math.max(0, -Math.cos(rad) < 0.98 ? 1 - (-Math.cos(rad)) : 0)).toFixed(3);
      });
      window.__timelines["carnet"] = tl;
    })();
  </script>
