  <script>
    (function () {
      const K = InkKit, $ = (s) => document.querySelector(s);
      const NS = "http://www.w3.org/2000/svg";
      const T0 = 2.4; // début de la scène dans le film
      const tl = gsap.timeline({ paused: true });
      $("#k-spiral").innerHTML = K.spiralRings();
      K.ensurePressFilter();
      const pIO = K.ease("power2.inOut");

      /* ---------- Page 1 : flash A tracé par-dessus le croquis (masque potrace) ---------- */
      const MA = JINKX.align.A.matrix;
      $("#k-amatrix").setAttribute("transform", `matrix(${MA[0][0]} ${MA[1][0]} ${MA[0][1]} ${MA[1][1]} ${MA[0][2]} ${MA[1][2]})`);
      const trA = new K.TraceReveal($("#k-amask-g"), JINKX.flashA.polys, { width: 22 });
      trA.ease = pIO;
      trA.grow = true;
      const byTop = trA.items.map((it, i) => [it.bbox[1], i]).sort((a, b) => a[0] - b[0]);
      const rankA = []; byTop.forEach(([, i], r) => (rankA[i] = r));
      const Lmax = Math.max(...trA.items.map((it) => it.L));
      trA.schedule((it, i) => {
        const s = 0.6 + 0.7 * (rankA[i] / trA.items.length);
        return [s, Math.min(0.36 + 0.6 * Math.sqrt(it.L / Lmax), 2.0 - s)];
      });
      tl.fromTo("#k-amask-full", { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.35, ease: "power2.inOut" }, 1.75);
      tl.fromTo("#k-aink", { filter: "saturate(1)", opacity: 1 }, { filter: "saturate(0)", duration: 0.7, ease: "power2.inOut" }, 0.6);
      tl.to("#k-aink", { opacity: 0, duration: 0.8, ease: "power2.in" }, 1.2);
      tl.fromTo("#k-apage", { opacity: 1 }, { opacity: 0.5, duration: 1.4, ease: "power2.inOut" }, 0.6);

      /* ---------- lignes de construction : tracées en 0,3 s, puis gommées (2–3 allers-retours) ---------- */
      const prepGuides = (g) => [...g.children].map((el) => {
        const L = el.getTotalLength();
        el.setAttribute("stroke-dasharray", `${L} ${L}`); el.setAttribute("stroke-dashoffset", L);
        return { el, L };
      });
      const guidesA = prepGuides($("#k-guidesA"));
      // éventail : arcs concentriques et rayons depuis le rivet (repère du flash B)
      const RV = [231, 452], a0 = -84, a1 = 50;
      const arc = (r) => { const p = (a) => [RV[0] + r * Math.cos((a * Math.PI) / 180), RV[1] + r * Math.sin((a * Math.PI) / 180)]; const s = p(a0), e = p(a1); return `M${s[0].toFixed(1)} ${s[1].toFixed(1)} A${r} ${r} 0 0 1 ${e[0].toFixed(1)} ${e[1].toFixed(1)}`; };
      let gB = "";
      [120, 245, 330, 430, 520].forEach((r) => (gB += `<path d="${arc(r)}"/>`));
      for (let a = a0; a <= a1 + 0.1; a += 13.4) { const c = Math.cos((a * Math.PI) / 180), s = Math.sin((a * Math.PI) / 180); gB += `<path d="M${(RV[0] + 30 * c).toFixed(1)} ${(RV[1] + 30 * s).toFixed(1)} L${(RV[0] + 540 * c).toFixed(1)} ${(RV[1] + 540 * s).toFixed(1)}"/>`; }
      gB += `<circle cx="${RV[0]}" cy="${RV[1]}" r="22"/>`;
      $("#k-guidesB").innerHTML = gB;
      const guidesB = prepGuides($("#k-guidesB"));
      const eraseA = $("#k-eraseA-p"), eraseB = $("#k-eraseB-p");
      const LeA = eraseA.getTotalLength(), LeB = eraseB.getTotalLength();
      [[eraseA, LeA], [eraseB, LeB]].forEach(([p, L]) => { p.setAttribute("stroke-dasharray", `${L} ${L + 10}`); p.setAttribute("stroke-dashoffset", L); });
      // miettes de gomme le long du geste
      const crumbs = (g, path, L, n, seed, scale) => {
        const r = K.mulberry32(seed), out = [];
        for (let i = 0; i < n; i++) {
          const u = (i + 0.5) / n, pt = path.getPointAtLength(u * L);
          const e = document.createElementNS(NS, "ellipse");
          e.setAttribute("fill", "#cfc6b6");
          g.appendChild(e);
          out.push({ e, u, x: pt.x + (r() - 0.5) * 160, y: pt.y + (r() - 0.5) * 120, rx: (3 + r() * 4) * scale, ry: (1.6 + r() * 2) * scale, dx: (r() - 0.5) * 60, dy: 20 + r() * 50, rot: r() * 180 });
        }
        return out;
      };
      const crA = crumbs($("#k-crumbsA"), eraseA, LeA, 9, 3, 1.1), crB = crumbs($("#k-crumbsB"), eraseB, LeB, 9, 4, 1.2);
      const drawGuides = (gs, t, at, dur) => { const k = pIO(K.clamp((t - at) / dur)); gs.forEach((g) => g.el.setAttribute("stroke-dashoffset", (g.L * (1 - k)).toFixed(1))); };
      const doErase = (p, L, cr, t, at, dur) => {
        const k = K.clamp((t - at) / dur);
        p.setAttribute("stroke-dashoffset", (L * (1 - k)).toFixed(1));
        for (const c of cr) {
          const age = t - (at + c.u * dur);
          const vis = age > 0 && age < 0.45;
          c.e.setAttribute("rx", vis ? c.rx : 0); c.e.setAttribute("ry", vis ? c.ry : 0);
          c.e.setAttribute("transform", `translate(${(c.x + c.dx * Math.max(0, age)).toFixed(1)} ${(c.y + c.dy * Math.max(0, age)).toFixed(1)}) rotate(${c.rot})`);
          c.e.setAttribute("opacity", (vis ? 1 - age / 0.45 : 0).toFixed(3));
        }
      };

      /* ---------- micro-labels : apparition par pression d'encre ---------- */
      const lab = ["#k-lab1", "#k-lab2", "#k-lab3", "#k-lab4"].map((s) => K.splitLetters($(s)));
      K.pressIn(tl, lab[0], 0.1);
      K.pressOut(tl, lab[0], 1.55);
      K.pressIn(tl, lab[1], 1.8);
      K.pressIn(tl, lab[2], 3.65);
      K.pressOut(tl, lab[2], 4.6);
      K.pressIn(tl, lab[3], 4.8);

      /* ---------- tourne de page à 5,4 s (local 3,0) : 8 bandes chaînées, recto + verso (dessin en transparence) ---------- */
      const NSTRIP = 8, SW = 1080 / NSTRIP;
      const flashTf = `translate(170px,190px) scale(1.35) matrix(${MA[0][0]},${MA[1][0]},${MA[0][1]},${MA[1][1]},${MA[0][2]},${MA[1][2]})`;
      const frontHTML = `<div style="position:absolute;inset:0;transform:scale(1.06);transform-origin:540px 900px;background:#ede6da">
          <img src="assets/img/croquisA_page.jpg" style="position:absolute;left:170px;top:190px;width:1080px;height:1663px;mix-blend-mode:multiply;opacity:0.5">
          <img src="assets/img/flashA_ink.png" style="position:absolute;left:0;top:0;width:702px;height:1065px;transform-origin:0 0;transform:${flashTf}">
          ${$("#k-blot").outerHTML.replace('id="k-blot"', 'style="position:absolute;left:868px;top:318px;width:60px;height:52px"')}
        </div>
        <div style="position:absolute;left:0;top:0;width:78px;height:100%;background:linear-gradient(90deg,rgba(18,17,16,0.16),rgba(18,17,16,0))"></div>
        <div class="k-label">FLASH · ENCRE</div>`;
      const ghostHTML = `<img src="assets/img/flashA_ink.png" style="position:absolute;left:0;top:0;width:702px;height:1065px;transform-origin:0 0;transform:scale(1.06) ${flashTf}">`;
      const strips = [];
      let parent = $("#k-turn");
      for (let k = 0; k < NSTRIP; k++) {
        const st = document.createElement("div");
        st.className = "k-strip";
        st.style.left = (k === 0 ? 0 : SW) + "px";
        st.style.width = SW + "px";
        const x0 = k * SW;
        st.innerHTML = `<div class="k-face"><div class="k-clone" style="left:${-x0}px">${frontHTML}</div><div class="k-fshade"></div><div class="k-sheen"></div></div>
          <div class="k-face k-back"><div class="k-ghost" style="left:${-(1080 - x0 - SW)}px">${ghostHTML}</div><div class="k-bshade"></div></div>`;
        parent.appendChild(st);
        strips.push({ el: st, fs: st.querySelector(".k-fshade"), bs: st.querySelector(".k-bshade"), sh: st.querySelector(".k-sheen") });
        parent = st;
      }
      const turnEl = $("#k-turn");

      /* ---------- Page 2 : éventail du croquis, papier calque, flash B tracé sur le calque ---------- */
      const MB = JINKX.align.B.matrix, sB = 1.65;
      const fbTf = `matrix(${sB * MB[0][0]}, ${sB * MB[1][0]}, ${sB * MB[0][1]}, ${sB * MB[1][1]}, ${-310 + sB * MB[0][2]}, ${174 + sB * MB[1][2]})`;
      $("#k-fb").style.transform = fbTf; $("#k-fb2").style.transform = fbTf;
      // feuille de calque : rectangle aux bords légèrement gondolés autour de l'éventail
      const mapB = (x, y) => [sB * (MB[0][0] * x + MB[0][1] * y + MB[0][2]) - 310, sB * (MB[1][0] * x + MB[1][1] * y + MB[1][2]) + 174];
      const cs = [mapB(0, 0), mapB(692, 0), mapB(0, 785), mapB(692, 785)];
      const X0 = Math.min(...cs.map((c) => c[0])) - 50, X1 = Math.min(1060, Math.max(...cs.map((c) => c[0])) + 40);
      const Y0 = Math.min(...cs.map((c) => c[1])) - 50, Y1 = Math.max(...cs.map((c) => c[1])) + 60;
      const rs = K.mulberry32(91);
      const wav = (n, a, b, fixed, horiz, amp) => { const pts = []; for (let i = 0; i <= n; i++) { const u = a + ((b - a) * i) / n, w = (rs() - 0.5) * amp + Math.sin(i * 1.7) * amp * 0.5; pts.push(horiz ? [u, fixed + w] : [fixed + w, u]); } return pts; };
      const edge = [...wav(14, X0, X1, Y0, true, 7), ...wav(16, Y0, Y1, X1, false, 6), ...wav(14, X1, X0, Y1, true, 7), ...wav(16, Y1, Y0, X0, false, 6)];
      const sheetD = "M" + edge.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L") + "Z";
      const sheet = $("#k-sheet");
      sheet.style.left = "0px"; sheet.style.top = "0px"; sheet.style.width = "1080px"; sheet.style.height = "1920px";
      sheet.style.clipPath = `path('${sheetD}')`;
      $("#k-sheet-shadow-p").setAttribute("d", sheetD);
      tl.fromTo(["#k-tasL", "#k-tasR"], { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 5.3);

      const p1 = $("#k-p1"), p1push = $("#k-p1-push"), p2push = $("#k-p2-push"), cam = $("#k-cam"), zoom = $("#k-zoom");
      const p2shadow = $("#k-p2-shadow"), calque = $("#k-calque"), cut = $("#k-cut"), cutpush = $("#k-cutpush");
      const bfan = $("#k-bfan"), fbInk = $("#k-fb-ink"), tasL2 = $("#k-tasL2"), tasR2 = $("#k-tasR2");
      const bleedA = $("#k-bleedA-d"), bleedB = $("#k-bleedB-d"), ableed = $("#k-ableed"), fbBleed = $("#k-fb-bleed");
      const leaves = [["#k-leafL", 285, 248, 0], ["#k-leafR", 428, 422, 1.9], ["#k-leafB", 395, 640, 3.7]].map(([s, x, y, ph]) => ({ el: $(s), x, y, ph }));
      const petals = (p) => { const N = 10, u = p * N, k = Math.min(N - 1, Math.floor(u)), f = u - k; return Math.min(1, (k + K.smooth(K.smooth(f))) / N); };

      K.ticker(tl, 6.65, (t) => {
        const tg = T0 + t;
        // fin de scène : plongée dans le rivet de l'éventail
        K.applyCam(cam, tg, t < 5.75 ? 1 : K.tw(t, 5.75, 0.9, 1, 1.7, "power2.in"));
        // pendant la tourne de page, la caméra recule pour montrer le volume de la feuille
        const zz = t < 3.2 ? K.tw(t, 2.75, 0.35, 1, 0.6, "power2.inOut") : K.tw(t, 3.5, 0.35, 0.6, 1, "power2.inOut");
        zoom.style.transform = `scale(${zz.toFixed(5)})`;
        p1push.style.transform = `scale(${(1 + 0.06 * K.clamp(t / 3.0)).toFixed(5)})`;
        const pushB = `scale(${(1 + 0.06 * K.clamp((t - 3.0) / 3.45)).toFixed(5)})`;
        p2push.style.transform = pushB; cutpush.style.transform = pushB;

        // page 1 : guides, tracé, gomme, brise dans les feuilles
        drawGuides(guidesA, t, 0.3, 0.3);
        trA.render(t);
        doErase(eraseA, LeA, crA, t, 2.0, 0.35);
        const bA = 6 * (1 - K.clamp((t - 0.6) / 1.4));
        if (bA > 0.05) { ableed.setAttribute("filter", "url(#k-bleedA)"); bleedA.setAttribute("scale", bA.toFixed(2)); } else ableed.removeAttribute("filter");
        const bw = K.clamp((t - 1.9) / 0.4);
        for (const lf of leaves) {
          const ang = bw * (1.5 * Math.sin((2 * Math.PI * (t - 1.9)) / 1.3 + lf.ph) + 0.4 * Math.sin((2 * Math.PI * (t - 1.9)) / 0.55 + lf.ph * 2));
          lf.el.setAttribute("transform", `rotate(${ang.toFixed(3)} ${lf.x} ${lf.y})`);
        }

        // tourne de page : la feuille tourne autour de la spirale et se courbe ; reflet au passage à 90°
        const pt = K.clamp((t - 3.0) / 0.5), A = 180 * pIO(pt), B = 40 * Math.sin(Math.PI * pt);
        const turning = t >= 3.0 && t < 3.5;
        p1.style.visibility = t >= 3.0 ? "hidden" : "visible";
        turnEl.style.visibility = turning ? "visible" : "hidden";
        if (turning) {
          let prev = 0;
          strips.forEach((s, k) => {
            const phi = Math.min(180, A + B * (k / (NSTRIP - 1)));
            s.el.style.transform = `rotateY(${(-(phi - prev)).toFixed(3)}deg)`;
            prev = phi;
            const r = (phi * Math.PI) / 180;
            s.fs.style.opacity = (0.34 * Math.sin(r) + 0.08 * K.clamp(phi / 90)).toFixed(3);
            s.bs.style.opacity = (0.3 * Math.sin(r)).toFixed(3);
            s.sh.style.opacity = (0.55 * Math.exp(-(((phi - 80) / 18) ** 2))).toFixed(3);
          });
        }
        const edgeX = 1080 * Math.max(0, Math.cos((Math.min(180, A + B) * Math.PI) / 180));
        p2shadow.style.width = (edgeX + 180 * Math.sin(Math.PI * pt)).toFixed(1) + "px";
        p2shadow.style.opacity = turning ? (0.9 * Math.sin(Math.PI * Math.min(1, pt * 1.15))).toFixed(3) : 0;

        // l'éventail du croquis s'ouvre depuis le rivet
        bfan.style.setProperty("--fo", (141 * pIO(K.clamp((t - 3.5) / 0.5))).toFixed(2));
        // le calque glisse sur le croquis (6,4 -> 6,8), puis se soulève en emportant le dessin propre (7,9 -> 8,1)
        const cin = K.tw(t, 4.0, 0.4, 1, 0, "power3.out"), lift = K.tw(t, 5.5, 0.25, 0, 1, "power2.in");
        calque.style.transform = `perspective(1400px) translate(${(1150 * cin).toFixed(1)}px, ${(-160 * lift).toFixed(1)}px) rotate(${(1.2 * cin).toFixed(2)}deg) rotateX(${(22 * lift).toFixed(2)}deg)`;
        calque.style.visibility = t >= 4.0 ? "visible" : "hidden";
        drawGuides(guidesB, t, 4.4, 0.3);
        doErase(eraseB, LeB, crB, t, 5.3, 0.3);
        fbInk.style.setProperty("--fa", (152 * petals(pIO(K.clamp((t - 4.55) / 0.85)))).toFixed(2));
        fbInk.style.setProperty("--fr", (900 * pIO(K.clamp((t - 5.2) / 0.3))).toFixed(1));
        const bB = 6 * (1 - K.clamp((t - 4.55) / 1.0));
        if (bB > 0.05) { fbBleed.style.filter = "url(#k-bleedB)"; bleedB.setAttribute("scale", bB.toFixed(2)); } else fbBleed.style.filter = "none";
        // 8,1 : coupe sur le flash seul ; les pompons se balancent (pendule amorti)
        cut.style.visibility = t >= 5.7 ? "visible" : "hidden";
        const tp = t - 5.7;
        const sw = tp > 0 ? 9 * Math.exp(-1.8 * tp) * Math.sin(2 * Math.PI * 1.65 * tp) : 0;
        const sw2 = sw * 0.8 + (tp > 0 ? 2.5 * Math.exp(-1.8 * tp) * Math.sin(2 * Math.PI * 1.65 * tp - 0.6) : 0);
        tasL2.style.transform = `rotate(${sw.toFixed(3)}deg)`; tasR2.style.transform = `rotate(${sw2.toFixed(3)}deg)`;
      });
      window.__timelines["croquis"] = tl;
    })();
  </script>
</template>
