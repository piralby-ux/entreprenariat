              <defs>

                  <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="17" result="n" />
                  <feDisplacementMap id="g-bleed-d" in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G" />
                </filter>

                    <!-- pression inégale : 85–100 % -->

                    <text x="90" y="128" text-anchor="middle" font-family="Cormorant Garamond" font-style="italic" font-weight="500" font-size="31" letter-spacing="2.5" fill="#000">TATOO</text>

            <svg id="g-front-tex" width="652" height="1150" viewBox="0 0 652 1150">

                <feColorMatrix type="matrix" values="0 0 0 0 0.16  0 0 0 0 0.155  0 0 0 0 0.15  0 0 0 1.4 -0.55" /></filter>

              <circle cx="566" cy="1046" r="4" fill="#121110" opacity="0.7" />

  </div>
  <script>
    (function () {
      const K = InkKit;
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);
      // spirale métal : anneaux sur le bord de reliure
      $("#g-spiral").innerHTML = K.spiralRings();

      const T0 = 18.0;
      const NS = "http://www.w3.org/2000/svg";
      // ville : variable de la vidéo (hyperframes render --variables '{"ville":"Lyon"}') ; sans ville, la ligne n'apparaît pas
      let ville = "";
      try { const v = window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables(); if (v && v.ville && !/^\[/.test(v.ville)) ville = v.ville; } catch (e) {}
      if (ville) { $("#g-ville").textContent = "TATOUEUSE · " + ville.toUpperCase(); }

      /* wordmark */
      const WM = JINKX.wordmark;
      $("#g-wm").setAttribute("transform", `translate(${WM.x0} ${WM.y0})`);
      const wp = $("#g-wm-path"); wp.setAttribute("d", WM.d); wp.setAttribute("transform", WM.transform);
      const mg = $("#g-wm-mg");
      const strokes = WM.strokes.map((st) => {
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", st.d); p.setAttribute("fill", "none"); p.setAttribute("stroke", "#fff");
        p.setAttribute("stroke-width", st.w); p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round");
        p.setAttribute("stroke-dasharray", `${st.L} ${st.L + 20}`); p.setAttribute("stroke-dashoffset", st.L);
        mg.appendChild(p);
        return { p, L: st.L };
      });
      const total = strokes.reduce((a, s) => a + s.L + 25, 0);
      let acc = 0;
      strokes.forEach((s) => { s.a = acc / total; acc += s.L + 25; s.b = (acc - 25) / total; });
      // ornements repris de ses flashs : une goutte au bout du « x », des grappes de trois points comme sur le bras
      const last = WM.strokes[WM.strokes.length - 1].d.slice(1).split(" L").map((q) => q.split(" ").map(Number));
      const e1 = last[last.length - 1], e0 = last[Math.max(0, last.length - 6)];
      const ang = (Math.atan2(e1[1] - e0[1], e1[0] - e0[0]) * 180) / Math.PI;
      const orn = $("#g-orn"), ornEls = [];
      const drop = document.createElementNS(NS, "path");
      drop.setAttribute("d", "M0 0 C7 -3.2 15 -7.5 23 -6.8 C30 -6 31.5 6 23 6.8 C15 7.5 7 3.2 0 0Z");
      drop.setAttribute("transform", `translate(${e1[0].toFixed(1)} ${e1[1].toFixed(1)}) rotate(${ang.toFixed(1)})`);
      orn.appendChild(drop); ornEls.push({ el: drop, at: 1.12, kind: "drop", tf: drop.getAttribute("transform") });
      const clusters = [[e1[0] + 40, e1[1] + 30], [118, 300]];
      clusters.forEach(([cx, cy], ci) => {
        [[0, 0, 5.2], [13, -5, 4], [9, 11, 3.4]].forEach(([dx, dy, r], di) => {
          const c = document.createElementNS(NS, "circle");
          c.setAttribute("cx", cx + dx); c.setAttribute("cy", cy + dy); c.setAttribute("r", 0);
          orn.appendChild(c); ornEls.push({ el: c, at: 1.15 + ci * 0.15 + di * 0.05, kind: "dot", r });
        });
      });
      tl.fromTo("#g-wm-full", { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.2 }, 1.05);

      /* CTA : la ligne mono se tape, la ligne serif s'écrit en balayage doux ; complet à 19,5 s */
      if (ville) { tl.set("#g-ville", { visibility: "visible" }, 0); K.typeIn(tl, K.splitLetters($("#g-ville")), 0.75, 0.014); }
      K.typeIn(tl, K.splitLetters($("#g-cta1")), 0.9, 0.016);

      const cam = $("#g-cam"), nb = $("#g-nb"), cover = $("#g-cover"), stamp = $("#g-stampwrap"), cta2 = $("#g-cta2");
      const shade = $("#g-pageshade"), frontShade = $("#g-front-shade"), backShade = $("#g-back-shade");
      const bleed = $("#g-bleed-d"), ink = $("#g-wm-ink");
      const writeE = K.ease("sine.inOut"), p4o = K.ease("power4.out");
      K.ticker(tl, 4.0, (t) => {
        const tg = T0 + t;
        // 18,0 : la plume part du point où l'encre s'est rétractée
        const w = writeE(K.clamp(t / 1.15));
        for (const s of strokes) {
          const k = K.clamp((w - s.a) / (s.b - s.a));
          s.p.setAttribute("stroke-dashoffset", (s.L * (1 - k)).toFixed(2));
          s.p.style.visibility = k > 0 ? "visible" : "hidden";
        }
        const b = 4 * (1 - K.clamp(t / 1.5));
        if (b > 0.05) { ink.setAttribute("filter", "url(#g-bleed)"); bleed.setAttribute("scale", b.toFixed(2)); } else ink.removeAttribute("filter");
        for (const o of ornEls) {
          const k = p4o(K.clamp((t - o.at) / 0.14));
          if (o.kind === "dot") o.el.setAttribute("r", (o.r * k).toFixed(2));
          else { o.el.setAttribute("transform", `${o.tf} scale(${k.toFixed(3)})`); o.el.style.visibility = k > 0 ? "visible" : "hidden"; }
        }
        cta2.style.setProperty("--w", K.tw(t, 1.2, 0.35, 0, 110, "power2.inOut").toFixed(2));
        // 19,8 : le sceau se tamponne (1.3 -> 1 en 0,15 s, léger écrasement), rotation −3°
        const ts = t - 1.8;
        let sc = 1.3, sqx = 1, sqy = 1, op = 0;
        if (ts >= 0) {
          sc = K.tw(ts, 0, 0.15, 1.3, 1, "power4.in");
          const sq = ts < 0.15 ? 0 : Math.exp(-(ts - 0.15) * 22) * Math.cos((ts - 0.15) * 40);
          sqx = 1 + 0.035 * sq; sqy = 1 - 0.05 * sq;
          op = K.tw(ts, 0, 0.06, 0, 1, "none");
        }
        stamp.style.transform = `rotate(-3deg) scale(${(sc * sqx).toFixed(4)}, ${(sc * sqy).toFixed(4)})`;
        stamp.style.opacity = op.toFixed(3);

        // 21,0 : recul vers le carnet (échelle 1,15 = première image), la couverture se referme depuis la gauche
        const zoom = t < 3.0 ? 1080 / 640 : K.tw(t, 3.0, 0.6, 1080 / 640, 1.15, "expo.inOut");
        K.applyCam(cam, tg, zoom);
        nb.style.transform = "scale(1)";
        const a = K.tw(t, 3.32, 0.56, 180, 0, "power3.inOut");
        cover.style.transform = `rotateY(${(-a).toFixed(3)}deg)`;
        const rad = (a * Math.PI) / 180;
        const c = Math.max(0, Math.cos(rad));
        shade.style.width = (640 * c).toFixed(1) + "px";
        shade.style.opacity = a < 1 ? 0 : (0.95 * c * Math.min(1, a / 8)).toFixed(3);
        frontShade.style.opacity = Math.min(1, Math.sin(rad) * 1.2).toFixed(3);
        backShade.style.opacity = (0.25 + 0.75 * Math.max(0, -Math.cos(rad) < 0.98 ? 1 - (-Math.cos(rad)) : 0)).toFixed(3);
      });
      window.__timelines["signature"] = tl;
    })();
  </script>
