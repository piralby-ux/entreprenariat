  <script>
    (function () {
      const K = InkKit;
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);
      // spirale métal : anneaux sur le bord de reliure
      $("#g-spiral").innerHTML = K.spiralRings();

      const T0 = 18.0;
      // ville du CTA : variable de la vidéo (hyperframes render --variables '{"ville":"Lyon"}')
      let ville = "[VILLE]";
      try { const v = window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables(); if (v && v.ville) ville = v.ville; } catch (e) {}
      $("#g-cta1").textContent = "TATOUEUSE · " + ville.toUpperCase();

      /* « Jinkx » écrit à la main : tracé monoline (squelette de Mrs Saint Delafield), 18,2 -> 19,6 */
      const SIG = JINKX.signature, sg = $("#g-sig-g");
      const SS = 1.45, bx = SIG.bbox;
      const sx = (1080 - (bx[2] - bx[0]) * SS) / 2 - 28 - bx[0] * SS, sy = 360 - bx[1] * SS;
      sg.setAttribute("transform", `translate(${sx.toFixed(1)} ${sy.toFixed(1)}) scale(${SS})`);
      sg.setAttribute("stroke-width", (7.2 / SS).toFixed(2));
      const strokes = SIG.strokes.map((d) => {
        const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        p.setAttribute("d", d); sg.appendChild(p);
        const L = p.getTotalLength(); p.setAttribute("stroke-dasharray", `${L} ${L + 10}`); p.setAttribute("stroke-dashoffset", L);
        return { p, L };
      });
      const total = strokes.reduce((a, s) => a + s.L + 40, 0);
      let acc = 0;
      strokes.forEach((s) => { s.a = acc / total; acc += s.L + 40; s.b = (acc - 40) / total; });

      /* CTA tapé en mono */
      const cta1 = K.splitLetters($("#g-cta1")), cta2 = K.splitLetters($("#g-cta2"));
      K.typeIn(tl, cta1, 1.95, 0.022);
      K.typeIn(tl, cta2, 2.1, 0.016);

      const cam = $("#g-cam"), nb = $("#g-nb"), cover = $("#g-cover"), stamp = $("#g-stampwrap");
      const shade = $("#g-pageshade"), frontShade = $("#g-front-shade"), backShade = $("#g-back-shade");
      const bleed = $("#g-bleed-d"), sigG = $("#g-sig-g");
      const writeE = K.ease("sine.inOut");
      K.ticker(tl, 4.0, (t) => {
        const tg = T0 + t;
        // écriture
        const w = writeE(K.clamp((t - 0.2) / 1.4));
        for (const s of strokes) {
          const k = K.clamp((w - s.a) / (s.b - s.a));
          s.p.setAttribute("stroke-dashoffset", (s.L * (1 - k)).toFixed(2));
          s.p.style.visibility = k > 0 ? "visible" : "hidden";
        }
        const b = 4 * (1 - K.clamp((t - 0.2) / 1.7));
        if (b > 0.05) { sigG.setAttribute("filter", "url(#g-bleed)"); bleed.setAttribute("scale", b.toFixed(2)); } else sigG.removeAttribute("filter");
        // 19,8 : le sceau se tamponne (1.3 -> 1 en 0,15 s, léger écrasement)
        const ts = t - 1.8;
        let sc = 1.3, sqx = 1, sqy = 1, op = 0;
        if (ts >= 0) {
          op = 1;
          sc = K.tw(ts, 0, 0.15, 1.3, 1, "power4.in");
          const sq = ts < 0.15 ? 0 : Math.exp(-(ts - 0.15) * 22) * Math.cos((ts - 0.15) * 40);
          sqx = 1 + 0.035 * sq; sqy = 1 - 0.05 * sq;
          op = K.tw(ts, 0, 0.06, 0, 1, "none");
        }
        stamp.style.transform = `rotate(-5deg) scale(${(sc * sqx).toFixed(4)}, ${(sc * sqy).toFixed(4)})`;
        stamp.style.opacity = op.toFixed(3);

        // 21,0 : recul caméra vers le carnet, la couverture se referme depuis la gauche (boucle sur la 1re image)
        const zoom = t < 3.0 ? 1080 / 640 : K.tw(t, 3.0, 0.6, 1080 / 640, 1, "expo.inOut");
        K.applyCam(cam, tg, zoom);
        nb.style.transform = "scale(1)";
        const a = K.tw(t, 3.28, 0.6, 180, 0, "power3.inOut");
        cover.style.transform = `rotateY(${(-a).toFixed(3)}deg)`;
        const rad = (a * Math.PI) / 180;
        const c = Math.max(0, Math.cos(rad));
        shade.style.width = (640 * c).toFixed(1) + "px";
        shade.style.opacity = a < 1 ? 0 : (0.95 * c * Math.min(1, a / 8)).toFixed(3);
        frontShade.style.opacity = Math.min(1, Math.sin(rad) * 1.2).toFixed(3);
        backShade.style.opacity = (0.25 + 0.75 * Math.max(0, -Math.cos(rad) < 0.98 ? 1 - (-Math.cos(rad)) : 0)).toFixed(3);
      });
      window.__timelines["signature"] = tl;
    })();
  </script>
