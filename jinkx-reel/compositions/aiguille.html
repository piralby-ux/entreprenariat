<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #n-bg { position: absolute; inset: 0; background: #ede6da; opacity: 0; }
    #n-cloud { position: absolute; inset: 0; }
    #n-world { position: absolute; inset: 0; }
    #n-cam { position: absolute; inset: 0; transform-origin: 540px 960px; }
    #n-push { position: absolute; inset: 0; transform-origin: 540px 900px; }
    .n-abs { position: absolute; display: block; }
    #n-shade { opacity: 0; }
    .n-cut { position: absolute; inset: 0; background: #ede6da; overflow: hidden; visibility: hidden; }
    .n-cut img { position: absolute; transform-origin: 0 0; }
    #n-flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
    #n-machine { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
  </style>
  <div id="root" data-composition-id="aiguille" data-width="1080" data-height="1920">
    <div id="n-bg"></div>
    <!-- 8,4 : l'encre de l'éventail se dissout comme une goutte dans l'eau ; le papier revient depuis le rivet -->
    <svg id="n-cloud" width="1080" height="1920" viewBox="0 0 1080 1920">
      <defs>
        <radialGradient id="n-cloud-g"><stop offset="0" stop-color="#ede6da" stop-opacity="1" /><stop offset="0.55" stop-color="#ede6da" stop-opacity="0.96" /><stop offset="1" stop-color="#ede6da" stop-opacity="0" /></radialGradient>
        <filter id="n-feather" x="-40%" y="-40%" width="180%" height="180%">
          <feTurbulence id="n-feather-t" type="fractalNoise" baseFrequency="0.011" numOctaves="4" seed="3" result="n" />
          <feDisplacementMap in="SourceGraphic" in2="n" scale="190" xChannelSelector="R" yChannelSelector="G" result="d" />
          <feGaussianBlur in="d" stdDeviation="9" />
        </filter>
        <filter id="n-feather2" x="-40%" y="-40%" width="180%" height="180%">
          <feTurbulence id="n-feather2-t" type="turbulence" baseFrequency="0.02" numOctaves="3" seed="12" result="n" />
          <feDisplacementMap in="SourceGraphic" in2="n" scale="120" xChannelSelector="G" yChannelSelector="R" result="d" />
          <feGaussianBlur in="d" stdDeviation="5" />
        </filter>
      </defs>
      <g filter="url(#n-feather)"><circle id="n-cl1" cx="410" cy="957" r="0" fill="url(#n-cloud-g)" /></g>
      <g filter="url(#n-feather2)"><circle id="n-cl2" cx="410" cy="957" r="0" fill="url(#n-cloud-g)" /><circle id="n-cl3" cx="410" cy="957" r="0" fill="url(#n-cloud-g)" /></g>
    </svg>
    <div id="n-world">
      <div id="n-cam">
        <div id="n-push">
          <svg class="n-abs" width="1080" height="1920" viewBox="0 0 1080 1920" style="left:0;top:0;overflow:visible">
            <defs>
              <mask id="n-mask" maskUnits="userSpaceOnUse" x="-100" y="-100" width="900" height="1520">
                <g id="n-mask-g"></g>
                <rect id="n-mask-full" x="-100" y="-100" width="900" height="1520" fill="#fff" opacity="0" />
              </mask>
              <!-- 13,2 : le haut du vase s'efface en fondu d'encre, les longues herbes restent -->
              <linearGradient id="n-keep-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0" /><stop offset="0.12" stop-color="#fff" stop-opacity="1" /></linearGradient>
              <filter id="n-erase-f" x="-40%" y="-40%" width="180%" height="180%">
                <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="4" seed="44" result="n" />
                <feDisplacementMap in="SourceGraphic" in2="n" scale="230" xChannelSelector="R" yChannelSelector="G" result="d" />
                <feGaussianBlur in="d" stdDeviation="10" />
              </filter>
              <mask id="n-erase" maskUnits="userSpaceOnUse" x="-200" y="-200" width="1100" height="1720">
                <rect x="-200" y="-200" width="1100" height="1720" fill="#fff" />
                <g filter="url(#n-erase-f)"><rect id="n-erase-e" x="-300" y="-400" width="1300" height="0" fill="#000" /></g>
                <rect id="n-keep" x="-200" y="900" width="1100" height="700" fill="url(#n-keep-g)" opacity="0" />
              </mask>
              <filter id="n-bleed" x="-5%" y="-5%" width="110%" height="110%">
                <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="9" result="n" />
                <feDisplacementMap id="n-bleed-d" in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" />
              </filter>
            </defs>
            <g id="n-vase" transform="translate(135 220) scale(1.1)">
              <g mask="url(#n-erase)">
                <image id="n-shade" href="assets/img/flashC_shade.png" width="700" height="1320" />
                <g id="n-lines-g" filter="url(#n-bleed)">
                  <image href="assets/img/flashC_lines.png" width="700" height="1320" mask="url(#n-mask)" />
                </g>
              </g>
            </g>
            <g id="n-splats"></g>
          </svg>
          <!-- machine rotative type « pen » : pointe en (0,0), axe horizontal, puis inclinée -->
          <svg id="n-machine" viewBox="0 0 1080 1920">
            <defs>
              <filter id="n-shadow-f" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" /></filter>
              <linearGradient id="n-matte" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#2a2826" /><stop offset="0.22" stop-color="#48443f" /><stop offset="0.34" stop-color="#1f1d1b" /><stop offset="0.75" stop-color="#121110" /><stop offset="1" stop-color="#0b0a0a" />
              </linearGradient>
              <linearGradient id="n-metal" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#8f8a82" /><stop offset="0.25" stop-color="#e3ded5" /><stop offset="0.5" stop-color="#9c978f" /><stop offset="1" stop-color="#4c4945" />
              </linearGradient>
              <linearGradient id="n-cart" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#5a5650" stop-opacity="0.9" /><stop offset="0.3" stop-color="#b8b2a8" stop-opacity="0.75" /><stop offset="1" stop-color="#2e2c29" stop-opacity="0.9" />
              </linearGradient>
              <g id="n-silhouette">
                <path d="M0 0 L14 -3 L60 -10 L60 -12 L110 -12 L110 -23 L250 -23 L250 -25 L262 -25 L262 -27 L520 -27 L520 -20 L545 -20 L545 -9 L600 -9 L600 9 L545 9 L545 20 L520 20 L520 27 L262 27 L262 25 L250 25 L250 23 L110 23 L110 12 L60 12 L60 10 L14 3 Z" />
                <path d="M600 0 C 690 0, 760 -70, 860 -200 S 1000 -420, 1080 -520" fill="none" stroke-width="11" />
              </g>
            </defs>
            <g id="n-mshadow" opacity="0.3" filter="url(#n-shadow-f)" fill="#121110" stroke="#121110"><use href="#n-silhouette" /></g>
            <g id="n-mbody">
              <!-- câble RCA qui sort par le haut du cadre -->
              <path d="M600 0 C 690 0, 760 -70, 860 -200 S 1000 -420, 1080 -520" fill="none" stroke="#151413" stroke-width="10" stroke-linecap="round" />
              <path d="M600 -3 C 690 -3, 758 -73, 857 -202" fill="none" stroke="#d9cfbf" stroke-width="1.4" opacity="0.18" />
              <rect x="545" y="-9" width="56" height="18" rx="3" fill="url(#n-matte)" />
              <rect x="560" y="-9.5" width="5" height="19" fill="url(#n-metal)" />
              <!-- aiguille + bec métallique -->
              <line x1="0" y1="0" x2="20" y2="0" stroke="#8d887f" stroke-width="1.7" stroke-linecap="round" />
              <path d="M14 -3 L60 -10 L60 10 L14 3 Z" fill="url(#n-metal)" />
              <!-- cartouche translucide -->
              <rect x="60" y="-12" width="52" height="24" rx="3" fill="url(#n-cart)" />
              <!-- grip strié -->
              <rect x="110" y="-23" width="142" height="46" rx="8" fill="url(#n-matte)" />
              <g id="n-knurl" stroke="#3b3835" stroke-width="2"></g>
              <!-- bague métallique -->
              <rect x="250" y="-25" width="13" height="50" rx="2" fill="url(#n-metal)" />
              <!-- corps cylindrique -->
              <rect x="262" y="-27" width="260" height="54" rx="10" fill="url(#n-matte)" />
              <!-- bague de réglage (moletée) -->
              <rect x="462" y="-28.5" width="30" height="57" rx="4" fill="#1d1c1a" />
              <g id="n-knurl2" stroke="#3a3734" stroke-width="1.6"></g>
              <rect x="520" y="-20" width="26" height="40" rx="6" fill="url(#n-matte)" />
              <!-- reflet spéculaire fin -->
              <line x1="275" y1="-15" x2="455" y2="-15" stroke="#f2ece2" stroke-width="2.2" opacity="0.32" stroke-linecap="round" />
              <line x1="120" y1="-12" x2="240" y2="-12" stroke="#f2ece2" stroke-width="1.4" opacity="0.2" stroke-linecap="round" />
              <rect x="100" y="-12" width="4" height="24" fill="#c2381f" />
            </g>
          </svg>
        </div>
      </div>
      <!-- match cuts : gros plans d'encre sur papier uni, même cadrage centré -->
      <div id="n-c1" class="n-cut"><img src="assets/img/flashB_full.png" /></div>
      <div id="n-c2" class="n-cut"><img src="assets/img/flashA_ink.png" /></div>
      <div id="n-c3" class="n-cut"><img src="assets/img/flashC_shade.png" /><img src="assets/img/flashC_lines.png" /></div>
      <div id="n-c4" class="n-cut"><img src="assets/img/peau2_tribal.png" style="filter:brightness(0.3)" /></div>
      <div id="n-c5" class="n-cut"><img src="assets/img/peau1_tattoo.png" /></div>
      <div id="n-flash"></div>
    </div>
  </div>
  <script>
    (function () {
      const K = InkKit, $ = (s) => document.querySelector(s);
      const T0 = 8.4;
      const NS = "http://www.w3.org/2000/svg";
      const tl = gsap.timeline({ paused: true });
      const OX = 135, OY = 220, SC = 1.1; // repère du flash C -> écran (le vase occupe ~70 % de la largeur)
      const toScreen = (p) => [OX + SC * p[0], OY + SC * p[1]];
      // stries du grip et de la bague
      let kn = "", kn2 = "";
      for (let x = 118; x < 248; x += 6) kn += `<line x1="${x}" y1="-21" x2="${x}" y2="21"/>`;
      for (let x = 465; x < 491; x += 4) kn2 += `<line x1="${x}" y1="-26" x2="${x}" y2="26"/>`;
      $("#n-knurl").innerHTML = kn; $("#n-knurl2").innerHTML = kn2;

      /* ---------- ordre du tracé : contour du vase, puis fleurs et longues herbes depuis le col ---------- */
      const tr = new K.TraceReveal($("#n-mask-g"), JINKX.flashC.polys, { width: 13 });
      tr.ease = K.ease("power2.inOut");
      tr.grow = true;
      const VASE = [247, 432, 462, 858], MOUTH = [352, 452];
      const ctr = (it) => [(it.bbox[0] + it.bbox[2]) / 2, (it.bbox[1] + it.bbox[3]) / 2];
      const inVase = (it) => { const [cx, cy] = ctr(it); return cx > VASE[0] && cx < VASE[2] && cy > VASE[1] && cy < VASE[3]; };
      const vase = [], rest = [];
      tr.items.forEach((it, i) => (inVase(it) ? vase : rest).push(i));
      vase.sort((a, b) => tr.items[a].bbox[1] - tr.items[b].bbox[1]);
      const dist = (it) => { const [cx, cy] = ctr(it); return Math.hypot(cx - MOUTH[0], (cy - MOUTH[1]) * (cy > MOUTH[1] ? 0.8 : 1.2)); };
      rest.sort((a, b) => dist(tr.items[a]) - dist(tr.items[b]));
      const Lmax = Math.max(...tr.items.map((it) => it.L));
      const sched = {};
      vase.forEach((i, r) => (sched[i] = [0.8 + 0.3 * (r / Math.max(1, vase.length)), 0.3]));
      rest.forEach((i, r) => {
        const it = tr.items[i];
        const s = 1.15 + 0.85 * Math.pow(r / rest.length, 0.85);
        const d = Math.min(0.3 + 1.1 * Math.sqrt(it.L / Lmax), 2.4 - s);
        sched[i] = [s, Math.max(0.12, d)];
      });
      tr.schedule((it, i) => sched[i]);
      tl.fromTo("#n-mask-full", { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.3, ease: "power2.inOut" }, 2.25);
      tl.fromTo("#n-shade", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 2.4);

      /* ---------- trajectoire de l'aiguille (précalculée) : suit un trait jusqu'au bout, puis se lève et va au suivant ---------- */
      const F0 = 0.8, F1 = 2.4, N = Math.round((F1 - F0) * 30);
      const traj = [], lift = [];
      let lead = null, cur = null, hop = null;
      for (let f = 0; f <= N; f++) {
        const t = F0 + f / 30;
        if (!lead || tr.progress(lead, t) >= 0.97) {
          lead = null;
          for (const it of tr.items) { const p = tr.progress(it, t); if (p > 0.02 && p < 0.9 && (!lead || it.L > lead.L)) lead = it; }
        }
        const target = lead ? toScreen(tr.head(lead, t)) : cur || toScreen(MOUTH);
        if (!cur) cur = target;
        if (!hop && Math.hypot(target[0] - cur[0], target[1] - cur[1]) > 22) hop = { from: cur.slice(), k: 0 };
        let lf = 0;
        if (hop) {
          hop.k++;
          const u = hop.k / 5;
          const e = K.smooth(Math.min(1, u));
          cur = [hop.from[0] + (target[0] - hop.from[0]) * e, hop.from[1] + (target[1] - hop.from[1]) * e];
          lf = Math.sin(Math.PI * Math.min(1, u));
          if (u >= 1) hop = null;
        } else cur = [cur[0] + (target[0] - cur[0]) * 0.6, cur[1] + (target[1] - cur[1]) * 0.6];
        traj.push(cur.slice()); lift.push(lf);
      }
      const at = (arr, t) => { const u = K.clamp((t - F0) * 30, 0, N); const i = Math.floor(u), f = u - i; const a = arr[i], b = arr[Math.min(N, i + 1)]; return Array.isArray(a) ? [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f] : a + (b - a) * f; };
      // éclaboussures d'encre minuscules, seulement quand l'aiguille touche le papier
      const rnd = K.mulberry32(77), splats = [];
      for (let f = 2; f < N; f += 3) {
        if (rnd() < 0.55 || lift[f] > 0.05) continue;
        const p = traj[f], a = rnd() * 6.283, r = 7 + rnd() * 16;
        splats.push({ t: F0 + f / 30, x: p[0] + Math.cos(a) * r, y: p[1] + Math.sin(a) * r, s: 1.2 + rnd() * 2.4 });
      }
      const sg = $("#n-splats"), pool = [];
      for (let i = 0; i < 14; i++) { const c = document.createElementNS(NS, "circle"); c.setAttribute("fill", "#121110"); c.setAttribute("r", "0"); sg.appendChild(c); pool.push(c); }

      /* ---------- match cuts : gros plans d'encre sur papier uni, centrés au même point, échelle de trait proche ---------- */
      const DOTS = JINKX.peau1dots.dots, d0 = DOTS.reduce((best, d) => (DOTS.filter((e) => Math.hypot(e[0] - d[0], e[1] - d[1]) < 34).length > best.n ? { n: DOTS.filter((e) => Math.hypot(e[0] - d[0], e[1] - d[1]) < 34).length, d } : best), { n: 0, d: DOTS[0] }).d;
      const cuts = [
        { el: "#n-c1", at: 3.0, w: 692, h: 785, cx: 345, cy: 215, s: 3.0 },   // chrysanthème de l'éventail
        { el: "#n-c2", at: 3.3, w: 702, h: 1065, cx: 560, cy: 560, s: 2.1 },  // une feuille du flash A
        { el: "#n-c3", at: 3.6, w: 700, h: 1320, cx: 352, cy: 640, s: 1.9 },  // le vase
        { el: "#n-c4", at: 3.9, w: 790, h: 1170, cx: 470, cy: 815, s: 2.0 },  // le tribal, forme seule
        { el: "#n-c5", at: 4.2, w: 790, h: 1170, cx: d0[0], cy: d0[1], s: 4.0 }, // les points ornementaux du bras
      ];

      cuts.forEach((c) => {
        c.node = $(c.el);
        c.imgs = [...c.node.querySelectorAll("img")];
        c.imgs.forEach((im) => { im.style.width = c.w + "px"; im.style.height = c.h + "px"; });
        tl.set(c.node, { visibility: "visible" }, c.at);
        tl.set(c.node, { visibility: "hidden" }, c.at + 0.3);
      });
      [3.0, 3.3, 3.6, 3.9, 4.2, 4.5].forEach((a) => {
        tl.set("#n-flash", { opacity: 0.09 }, a);
        tl.set("#n-flash", { opacity: 0 }, a + 2 / 30);
      });

      const bg = $("#n-bg"), cam = $("#n-cam"), push = $("#n-push");
      const c1 = $("#n-cl1"), c2 = $("#n-cl2"), c3 = $("#n-cl3"), ft1 = $("#n-feather-t"), ft2 = $("#n-feather2-t");
      const mbody = $("#n-mbody"), mshadow = $("#n-mshadow"), bleed = $("#n-bleed-d"), linesG = $("#n-lines-g");
      const eraseE = $("#n-erase-e"), keep = $("#n-keep"), vaseG = $("#n-vase");
      const ANG = -55;

      K.ticker(tl, 5.4, (t) => {
        const tg = T0 + t;
        // dissolution : nuages de papier aux bords effilochés, depuis le rivet (8,4 -> 9,05)
        const R = K.tw(t, 0, 0.55, 0, 2600, "power1.inOut");
        c1.setAttribute("r", R.toFixed(1));
        c2.setAttribute("r", (R * 0.82).toFixed(1));
        c3.setAttribute("r", (R * 0.6).toFixed(1));
        c3.setAttribute("cx", (410 + 0.08 * R).toFixed(1)); c3.setAttribute("cy", (957 - 0.1 * R).toFixed(1));
        ft1.setAttribute("baseFrequency", (0.011 + 0.003 * Math.sin(t * 5)).toFixed(5));
        ft2.setAttribute("baseFrequency", (0.02 + 0.004 * Math.cos(t * 6)).toFixed(5));
        bg.style.opacity = t >= 0.56 ? 1 : 0;
        $("#n-cloud").style.visibility = t < 0.6 ? "visible" : "hidden";

        K.applyCam(cam, tg, K.tw(t, 0.3, 0.7, 1.06, 1, "power2.out"));
        push.style.transform = `scale(${(1 + 0.05 * K.clamp(t / 3.0)).toFixed(5)})`;

        tr.render(t);
        const b = 5 * (1 - K.clamp((t - 2.0) / 0.6));
        if (b > 0.05) { linesG.setAttribute("filter", "url(#n-bleed)"); bleed.setAttribute("scale", b.toFixed(2)); } else linesG.removeAttribute("filter");

        // machine : entre par la droite, trace, se lève entre deux traits, ressort
        let tip, lf = 0;
        const start = traj[0], end = traj[N], off = [1250, 560];
        if (t < F0) { const k = K.tw(t, 0.6, F0 - 0.6, 0, 1, "power4.out"); tip = [off[0] + (start[0] - off[0]) * k, off[1] + (start[1] - off[1]) * k]; lf = 1 - k; }
        else if (t <= F1) { tip = at(traj, t); lf = at(lift, t); }
        else { const k = K.tw(t, F1 + 0.1, 0.4, 0, 1, "power3.in"); tip = [end[0] + (1350 - end[0]) * k, end[1] + (260 - end[1]) * k]; lf = Math.min(1, k * 3); }
        const fr = Math.round(tg * 30);
        const on = t >= F0 && t <= F1 && lf < 0.05;
        const jx = on ? K.hash(fr * 3 + 1) * 2 - 1 : 0, jy = on ? K.hash(fr * 3 + 2) * 2 - 1 : 0;
        const ly = -6 * lf;
        mbody.setAttribute("transform", `translate(${(tip[0] + jx).toFixed(2)} ${(tip[1] + jy + ly).toFixed(2)}) rotate(${ANG}) scale(${(1 + 0.012 * lf).toFixed(4)})`);
        // ombre courte, collée à la pointe ; elle s'allonge un peu quand la machine se lève
        mshadow.setAttribute("transform", `translate(${(tip[0] + 5 + 12 * lf).toFixed(2)} ${(tip[1] + 6 + 14 * lf).toFixed(2)}) rotate(${ANG + 3})`);
        mshadow.setAttribute("opacity", (0.3 - 0.08 * lf).toFixed(3));
        let k = 0;
        for (const s of splats) {
          const age = t - s.t;
          if (age < 0 || age > 0.25 || k >= pool.length) continue;
          const c = pool[k++];
          c.setAttribute("cx", s.x.toFixed(1)); c.setAttribute("cy", s.y.toFixed(1));
          c.setAttribute("r", (s.s * Math.min(1, age / 0.04)).toFixed(2));
          c.setAttribute("opacity", (0.85 * (1 - age / 0.25)).toFixed(3));
        }
        for (; k < pool.length; k++) pool[k].setAttribute("r", "0");

        for (const c of cuts) {
          if (t < c.at || t >= c.at + 0.3) continue;
          const z = c.s * K.tw(t, c.at, 0.3, 1.04, 1, "power4.out");
          const tx = 540 - c.cx * z, ty = 900 - c.cy * z;
          c.imgs.forEach((im) => (im.style.transform = `translate(${tx.toFixed(1)}px, ${ty.toFixed(1)}px) scale(${z.toFixed(4)})`));
        }

        // 13,2 -> 13,8 : le haut du vase s'efface (bords turbulents), les herbes restent puis passent la main au bras
        // front d'encre qui descend du haut jusqu'au départ des herbes
        const er = K.tw(t, 4.8, 0.45, 0, 1320, "power1.in");
        eraseE.setAttribute("height", er.toFixed(1));
        keep.setAttribute("opacity", t >= 4.8 ? 1 : 0);
        vaseG.style.opacity = K.tw(t, 5.0, 0.38, 1, 0, "power2.in").toFixed(3);
      });
      window.__timelines["aiguille"] = tl;
    })();
  </script>
</template>
