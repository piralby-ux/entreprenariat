        --grey: #c0c0c0;

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--void);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--void);
      }
      #scene3d {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      @font-face {
        font-family: "Bungee";
        src: url("assets/fonts/Bungee-Regular.ttf") format("truetype");
      }
      @font-face {
        font-family: "Ultra";
        src: url("assets/fonts/Ultra-Regular.ttf") format("truetype");
      }
      /* the slot: a one-reel slot machine pops on the frozen frame, spins 0 → 1, wins, then
         shrinks into the HUD. Box centre = digit centre = frame centre (960, 540). */
      #slot {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
      }
      #slot-box {
        position: absolute;
        left: 790px;
        top: 330px;
        width: 340px;
        height: 420px;
      }
      #slot-cab {
        position: absolute;
        inset: 0;
        background: #ff3c38;
        border: 14px solid #ffd23f;
        border-radius: 40px;
        box-shadow: 0 18px 0 #6b1d1a;
      }
      .bulb {
        position: absolute;
        width: 20px;
        height: 20px;
        margin: -10px 0 0 -10px;
        border-radius: 50%;
        background: #7a5a10;
      }
      #slot-winbg {
        position: absolute;
        left: 40px;
        top: 60px;
        width: 260px;
        height: 300px;
        border-radius: 20px;
        background: #160d2e;
        border: 6px solid #0a0b0d;
      }
      #slot-window {
        position: absolute;
        left: 40px;
        top: 60px;
        width: 260px;
        height: 300px;
        border-radius: 20px;
        overflow: hidden;
      }
      #slot-strip {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        font-family: "Bungee", sans-serif;
        font-size: 250px;
        color: #ffffff;
        text-align: center;

        display: block;
        height: 300px;
        line-height: 330px;
      }
      #slot-glass {
        position: absolute;
        left: 40px;
        top: 60px;
        width: 260px;
        height: 300px;
        border-radius: 20px;
        background: linear-gradient(180deg, rgba(10, 11, 13, 0.75) 0%, rgba(10, 11, 13, 0) 22%, rgba(255, 255, 255, 0.08) 50%, rgba(10, 11, 13, 0) 78%, rgba(10, 11, 13, 0.75) 100%);

        -webkit-text-stroke: 10px #0a0b0d;
        paint-order: stroke fill;
        text-shadow: 0 10px 0 #6b1d1a;
        opacity: 0;
      }
      #hud {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }
      /* not a box: a soft corner shade so the count reads over the bright city */
      #hud-shade {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 1100px;
        height: 620px;
        background: radial-gradient(ellipse at 0% 100%, rgba(10, 11, 13, 0.82) 0%, rgba(10, 11, 13, 0.55) 38%, rgba(10, 11, 13, 0) 72%);
        opacity: 0;
      }
      #hud-inner {
        position: absolute;
        left: 112px;
        bottom: 104px;
        font-family: var(--font-hud);
        color: var(--grey);
      }
      #hud-label {
        font-size: 28px;
        font-weight: 400;
        letter-spacing: 0.18em;
        opacity: 0;
        margin-bottom: 4px;
      }
      #hud-count {
        font-size: 96px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.02em;
        white-space: pre;
        font-variant-numeric: tabular-nums;
        opacity: 0;
      }
      /* the final card: a cartoon cast-iron weight marked « 5 TONNES » falls on the city */

        position: absolute;
        inset: 0;
        z-index: 4;
        pointer-events: none;

      #final-scrim {

        left: 0;
        top: 0;

    <script>
      // HUD: the count is read from the 3D scene's pure count(t), so it always matches the pops.
      const tl = gsap.timeline({ paused: true });
      const countEl = document.getElementById("hud-count");
      // From RUN the count stops tracking the pops and runs away (cubic), so it never settles on
      // a number; from REEL its low digits spin like slot reels, more and more of them, until the
      // whole number is a blur at POP, where « 5 TONNES » replaces it. Pure in t: the spinning
      // digits are a hash of the 60 fps frame index and the digit position.
      const RUN = 14.0, REEL = 14.7, POP = 15.45;
      const hash = (a) => {
        let h = Math.imul(a ^ 0x9e3779b9, 0x85ebca6b);
        h ^= h >>> 13;
        h = Math.imul(h, 0xc2b2ae35);
        h ^= h >>> 16;
        return (h >>> 0) / 4294967296;
      };
      const display = (t, base) => {
        const run = Math.max(0, t - RUN);
        let s = String(Math.max(1, Math.floor(base * (1 + 1.5 * run + 2.2 * run * run * run))));
        if (t >= REEL) {
          const f = Math.floor(t * 60);
          const nSpin = Math.min(s.length, 1 + Math.floor(((t - REEL) / (POP - REEL)) * s.length * 1.2));
          s = s.split("").map((ch, i) => (i >= s.length - nSpin ? String(Math.floor(hash(f * 37 + i) * 10)) : ch)).join("");
        }
        return s.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
      };
      const bulbs = Array.from(document.querySelectorAll("#slot-cab .bulb"));
      const clock = { t: 0 };
      tl.to(
        clock,
        {
          t: 18.5,
          duration: 18.5,
          ease: "none",
          onUpdate: () => {
            const api = window.__demineur;
            const t = tl.time();
            countEl.textContent = display(t, api && api.count ? api.count(t) : 1);
            // slot bulbs: a 4-step chase while the reel spins, all blinking at 12 Hz on the win
            if (t >= 3.0 && t < 4.76) {
              const chase = Math.floor(t * 24), blink = Math.floor(t * 12) % 2 === 0;
              bulbs.forEach((b, i) => {
                const on = t < 3.74 ? (((i - chase) % 4) + 4) % 4 === 0 : blink;
                b.style.backgroundColor = on ? "#fff6c8" : "#7a5a10";
              });
            }
          },
        },
        0,
      );

      // --- slot (3.0 → 4.76): the machine pops up, the reel spins 0 → 1 (21 cells of 300 px),
      // jackpot flash and « +1 », then the reel shrinks into the HUD slot (count centre 140.8, 928)
      tl.set("#slot-plus", { opacity: 0 }, 3.0);
      tl.fromTo("#slot-box", { x: 0, y: 140, scale: 0.15, rotation: -14, opacity: 1, transformOrigin: "50% 50%" }, { y: 0, scale: 1.3, rotation: 0, duration: 0.26, ease: "back.out(2.2)" }, 3.02);
      tl.fromTo("#slot-strip", { y: 0, filter: "blur(0px)" }, { y: -6300, duration: 0.64, ease: "back.out(1.1)" }, 3.1);
      tl.to("#slot-strip", { filter: "blur(8px)", duration: 0.1, ease: "power1.in" }, 3.1);
      tl.to("#slot-strip", { filter: "blur(0px)", duration: 0.22, ease: "power2.in" }, 3.44);
      tl.to("#slot-box", { keyframes: [{ scale: 1.46, rotation: -3, duration: 0.06 }, { scale: 1.25, rotation: 2, duration: 0.08 }, { scale: 1.3, rotation: 0, duration: 0.12 }] }, 3.74);
      tl.set("#slot-plus", { opacity: 1 }, 3.76);
      tl.fromTo("#slot-plus", { y: 40, scale: 0.3, rotation: -12, immediateRender: false }, { y: -30, scale: 1, rotation: 6, duration: 0.25, ease: "back.out(3)" }, 3.76);
      tl.to("#slot-plus", { y: -120, opacity: 0, duration: 0.3, ease: "power2.in" }, 4.08);
      tl.to(["#slot-cab", "#slot-winbg", "#slot-glass"], { opacity: 0, duration: 0.2, ease: "power1.in" }, 4.3);
      tl.to("#slot-box", { x: -819.2, y: 388, scale: 0.384, duration: 0.42, ease: "power3.inOut" }, 4.28);
      tl.to("#slot-strip", { color: "#c0c0c0", duration: 0.3, ease: "none" }, 4.36);
      tl.to("#slot-box", { opacity: 0, duration: 0.06, ease: "none" }, 4.7);

      // --- HUD takes over exactly where the 1 lands
      tl.fromTo("#hud-count", { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 4.66);
      tl.fromTo("#hud-label", { opacity: 0 }, { opacity: 0.6, duration: 0.25, ease: "power1.out" }, 4.75);
      // the shade arrives with the bright city (act 5), not before
      tl.fromTo("#hud-shade", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.inOut" }, 11.9);

      // --- the counter boils over (14.9 → 15.45), then « 5 TONNES » slams in its place
      tl.fromTo("#hud-count", { scale: 1, transformOrigin: "0% 100%" }, { scale: 1.18, duration: 0.5, ease: "power2.in" }, 14.9);
      tl.fromTo("#hud-inner", { x: 0 }, { keyframes: [{ x: -4, duration: 0.03 }, { x: 5, duration: 0.03 }, { x: -3, duration: 0.03 }, { x: 4, duration: 0.03 }, { x: -5, duration: 0.03 }, { x: 3, duration: 0.03 }, { x: 0, duration: 0.03 }] }, 15.2);
      tl.to("#hud-inner", { opacity: 0, scale: 1.3, transformOrigin: "0% 100%", duration: 0.08, ease: "power1.in" }, 15.42);
      // the weight: free fall (power2.in) 15.28 → 15.48, lands flat and squats, the world shakes,
      // the ground cracks and dust rolls out from under it
      tl.set("#final-sub-in", { opacity: 0 }, 15.1);
      tl.set(".puff", { opacity: 0 }, 15.1);
      tl.set(".crack", { strokeDasharray: 1, strokeDashoffset: 1 }, 15.1);
      tl.fromTo("#final-scrim", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 15.1);
      tl.fromTo("#final-weight", { y: -1150, rotation: -5, scaleX: 1, scaleY: 1, transformOrigin: "50% 100%" }, { y: 0, rotation: 0, duration: 0.2, ease: "power2.in" }, 15.28);
      tl.to("#final-weight", { keyframes: [{ scaleX: 1.06, scaleY: 0.88, duration: 0.05, ease: "power1.out" }, { scaleX: 0.99, scaleY: 1.02, duration: 0.1, ease: "power1.inOut" }, { scaleX: 1, scaleY: 1, duration: 0.14, ease: "power1.out" }] }, 15.48);
      tl.fromTo("#scene3d", { x: 0, y: 0 }, { keyframes: [{ x: -14, y: 10, duration: 0.03 }, { x: 12, y: -8, duration: 0.04 }, { x: -8, y: 6, duration: 0.04 }, { x: 5, y: -3, duration: 0.05 }, { x: 0, y: 0, duration: 0.06 }] }, 15.48);
      tl.to(".crack", { strokeDashoffset: 0, duration: 0.16, ease: "power2.out", stagger: 0.02 }, 15.48);
      gsap.utils.toArray(".puff").forEach((p, i) => {
        const side = i < 3 ? -1 : 1, far = i === 0 || i === 5 ? 1.4 : i === 2 || i === 3 ? 0.6 : 1;
        tl.set(p, { opacity: 0.95 }, 15.48);
        tl.fromTo(p, { x: 0, y: 0, scale: 0.3, immediateRender: false }, { x: side * 150 * far, y: -40, scale: 1.7, opacity: 0, duration: 0.95, ease: "power2.out" }, 15.48);
      });
      tl.set("#final-sub-in", { opacity: 1 }, 15.85);
      tl.fromTo("#final-sub-in", { y: 14, immediateRender: false }, { y: 0, duration: 0.3, ease: "power2.out" }, 15.85);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
