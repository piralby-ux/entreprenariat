    <script>
      // HUD: the count is read from the 3D scene's pure count(t), so it always matches the pops.
      const tl = gsap.timeline({ paused: true });
      const countEl = document.getElementById("hud-count");
      // From RUN the count stops tracking the pops and runs away (cubic), so it never settles on
      // a number; from REEL its low digits spin like slot reels, more and more of them, until the
      // whole number is a blur at POP, where « 5 TONNES » replaces it. Pure in t: the spinning
      // digits are a hash of the 60 fps frame index and the digit position.
      // bloc1-v2: a 4.5 s beat is inserted at INS = 14.6 s; every 2D event after it moves by DELTA.
      // Through the insert the runaway is held (r frozen at 0.6) while the base count keeps following
      // the city, so the counter never stops climbing.
      const INS = 14.6, DELTA = 4.5, T0 = 15.58, T_HIT = 15.48 + DELTA;
      const RUN = 14.0, REEL = 14.7 + DELTA, POP = 15.45 + DELTA;
      const story = (t) => (t < INS ? t : t < INS + DELTA ? INS : t - DELTA);
      const hash = (a) => {
        let h = Math.imul(a ^ 0x9e3779b9, 0x85ebca6b);
        h ^= h >>> 13;
        h = Math.imul(h, 0xc2b2ae35);
        h ^= h >>> 16;
        return (h >>> 0) / 4294967296;
      };
      const display = (t, base) => {
        const run = Math.max(0, story(t) - RUN);
        let s = String(Math.max(1, Math.floor(base * (1 + 1.5 * run + 2.2 * run * run * run))));
        if (t >= REEL) {
          const f = Math.floor(t * 60);
          const nSpin = Math.min(s.length, 1 + Math.floor(((t - REEL) / (POP - REEL)) * s.length * 1.2));
          s = s.split("").map((ch, i) => (i >= s.length - nSpin ? String(Math.floor(hash(f * 37 + i) * 10)) : ch)).join("");
        }
        return s.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
      };
      const bulbs = Array.from(document.querySelectorAll("#slot-cab .bulb"));
      const clock = { t: 0 };
      tl.to(
        clock,
        {
          t: 23,
          duration: 23,
          ease: "none",
          onUpdate: () => {
            const api = window.__demineur;
            const t = tl.time();
            countEl.textContent = display(t, api && api.count ? api.count(t) : 1);
            if (t >= T0 + 0.85 && t < T0 + 4.25) rollDogs(t);
            // slot bulbs: a 4-step chase while the reel spins, all blinking at 12 Hz on the win
            if (t >= 3.0 && t < 4.76) {
              const chase = Math.floor(t * 24), blink = Math.floor(t * 12) % 2 === 0;
              bulbs.forEach((b, i) => {
                const on = t < 3.74 ? (((i - chase) % 4) + 4) % 4 === 0 : blink;
                b.style.backgroundColor = on ? "#fff6c8" : "#7a5a10";
              });
            }
          },
        },
        0,
      );

      // --- slot (3.0 → 4.76): the machine pops up, the reel spins 0 → 1 (21 cells of 300 px),
      // jackpot flash and « +1 », then the reel shrinks into the HUD slot (count centre 140.8, 928)
      tl.set("#slot-plus", { opacity: 0 }, 3.0);
      tl.fromTo("#slot-box", { x: 0, y: 140, scale: 0.15, rotation: -14, opacity: 1, transformOrigin: "50% 50%" }, { y: 0, scale: 1.3, rotation: 0, duration: 0.26, ease: "back.out(2.2)" }, 3.02);
      tl.fromTo("#slot-strip", { y: 0, filter: "blur(0px)" }, { y: -6300, duration: 0.64, ease: "back.out(1.1)" }, 3.1);
      tl.to("#slot-strip", { filter: "blur(8px)", duration: 0.1, ease: "power1.in" }, 3.1);
      tl.to("#slot-strip", { filter: "blur(0px)", duration: 0.22, ease: "power2.in" }, 3.44);
      tl.to("#slot-box", { keyframes: [{ scale: 1.46, rotation: -3, duration: 0.06 }, { scale: 1.25, rotation: 2, duration: 0.08 }, { scale: 1.3, rotation: 0, duration: 0.12 }] }, 3.74);
      tl.set("#slot-plus", { opacity: 1 }, 3.76);
      tl.fromTo("#slot-plus", { y: 40, scale: 0.3, rotation: -12, immediateRender: false }, { y: -30, scale: 1, rotation: 6, duration: 0.25, ease: "back.out(3)" }, 3.76);
      tl.to("#slot-plus", { y: -120, opacity: 0, duration: 0.3, ease: "power2.in" }, 4.08);
      tl.to(["#slot-cab", "#slot-winbg", "#slot-glass"], { opacity: 0, duration: 0.2, ease: "power1.in" }, 4.3);
      tl.to("#slot-box", { x: -819.2, y: 388, scale: 0.384, duration: 0.42, ease: "power3.inOut" }, 4.28);
      tl.to("#slot-strip", { color: "#c0c0c0", duration: 0.3, ease: "none" }, 4.36);

      const D = DELTA;
      tl.fromTo("#hud-count", { scale: 1, transformOrigin: "0% 100%" }, { scale: 1.18, duration: 0.5, ease: "power2.in" }, 14.9 + D);

      tl.to("#hud-inner", { opacity: 0, scale: 1.3, transformOrigin: "0% 100%", duration: 0.08, ease: "power1.in" }, 15.42 + D);
      // the weight: free fall (power2.in) 19.78 → 19.98, lands flat and squats, the world shakes,
      // the ground cracks and dust rolls out from under it
      tl.set(".final-line", { opacity: 0 }, 15.1 + D);
      tl.set(".puff", { opacity: 0 }, 15.1 + D);
      tl.set(".crack", { strokeDasharray: 1, strokeDashoffset: 1 }, 15.1 + D);
      tl.fromTo("#final-scrim", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 15.1 + D);
      tl.fromTo("#final-weight", { y: -1150, rotation: -5, scaleX: 1, scaleY: 1, transformOrigin: "50% 100%" }, { y: 0, rotation: 0, duration: 0.2, ease: "power2.in" }, 15.28 + D);
      tl.to("#final-weight", { keyframes: [{ scaleX: 1.06, scaleY: 0.88, duration: 0.05, ease: "power1.out" }, { scaleX: 0.99, scaleY: 1.02, duration: 0.1, ease: "power1.inOut" }, { scaleX: 1, scaleY: 1, duration: 0.14, ease: "power1.out" }] }, T_HIT);
      tl.fromTo("#scene3d", { x: 0, y: 0 }, { keyframes: [{ x: -14, y: 10, duration: 0.03 }, { x: 12, y: -8, duration: 0.04 }, { x: -8, y: 6, duration: 0.04 }, { x: 5, y: -3, duration: 0.05 }, { x: 0, y: 0, duration: 0.06 }] }, T_HIT);
      tl.to(".crack", { strokeDashoffset: 0, duration: 0.16, ease: "power2.out", stagger: 0.02 }, T_HIT);
      gsap.utils.toArray(".puff").forEach((p, i) => {
        const side = i < 3 ? -1 : 1, far = i === 0 || i === 5 ? 1.4 : i === 2 || i === 3 ? 0.6 : 1;
        tl.set(p, { opacity: 0.95 }, T_HIT);
        tl.fromTo(p, { x: 0, y: 0, scale: 0.3, immediateRender: false }, { x: side * 150 * far, y: -40, scale: 1.7, opacity: 0, duration: 0.95, ease: "power2.out" }, T_HIT);
      });
      // bloc1-v2: the figure lands 0.4 s after the hit, its label and the source just after; all hold to the end
      [["#final-l1", 0.4], ["#final-l2", 0.52], ["#final-src", 0.64]].forEach(([sel, dt]) => {
        tl.fromTo(sel, { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power4.out", immediateRender: false }, T_HIT + dt);
      });

      // --- bloc1-v2: the stamp « INDICE N°1 — LES CHIFFRES » (T0 = 15.58)
      // slams from ×1.9 in 0.08 s (power4.in, −7°, no bounce), holds 0.9 s, then shrinks to 35 % in the
      // top-left corner (centre 380, 187) and stays there until the weight falls
      tl.fromTo("#indice-box", { x: 0, y: 0, scale: 1.9, rotation: -7, opacity: 1, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.08, ease: "power4.in" }, T0 - 0.08);
      tl.fromTo("#indice-box", { x: 0, y: 0, scale: 1 }, { x: -580, y: -353, scale: 0.35, duration: 0.35, ease: "power3.inOut", immediateRender: false }, T0 + 0.9);
      tl.fromTo("#indice-box", { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power1.in", immediateRender: false }, T0 + 4.2);
      // a dozen ink drops thrown off the frame's edge on the hit (fixed seed)
      {
        let a = 0x1d1ce;
        const rnd = () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const ink = document.getElementById("indice-ink");
        for (let i = 0; i < 12; i++) {
          const ang = (i / 12) * Math.PI * 2 + (rnd() - 0.5) * 0.4;
          const ex = 505 + Math.cos(ang) * 540, ey = 165 + Math.sin(ang) * 190; // on the frame's edge
          const size = 8 + rnd() * 18, far = 50 + rnd() * 120;
          const el = document.createElement("span");
          el.className = "drop";
          el.style.width = el.style.height = size + "px";
          el.style.left = ex - size / 2 + "px";
          el.style.top = ey - size / 2 + "px";
          ink.appendChild(el);
          tl.fromTo(el, { x: 0, y: 0, scale: 1, opacity: 1 }, { x: Math.cos(ang) * far, y: Math.sin(ang) * far * 0.7, scale: 0.4, opacity: 0, duration: 0.4, ease: "power3.out" }, T0);
        }
      }

      // --- bloc1-v2: « + de 50 000 chiens à Toulouse » (T0 + 0.9 → T0 + 4.2)
      // the number rolls 0 → N in 2.2 s (power2.out) on odometer reels: each digit turns with the one
      // below it and carries in its last tenth; leading zeros sit dim until they are reached
      const vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
      const N = Math.max(0, Math.round(Number(vars.dogs_number ?? 50000)) || 0);
      const digits = String(N).length;
      const numEl = document.getElementById("dogs-num");
      numEl.setAttribute("aria-label", String(N).replace(/\B(?=(\d{3})+(?!\d))/g, " "));
      const reels = [];
      for (let k = digits - 1; k >= 0; k--) {
        const reel = document.createElement("div");
        reel.className = "reel";
        const strip = document.createElement("div");
        strip.className = "reel-strip";
        strip.innerHTML = "01234567890".split("").map((d) => "<span>" + d + "</span>").join("");
        reel.appendChild(strip);
        numEl.appendChild(reel);
        reels.push({ k, reel, strip });
        if (k % 3 === 0 && k > 0) { const gap = document.createElement("div"); gap.className = "reel gap reel-gap"; numEl.appendChild(gap); }
      }
      const ROLL0 = T0 + 0.9, ROLL = 2.2;
      function rollDogs(t) {
        const u = Math.min(1, Math.max(0, (t - ROLL0) / ROLL));
        const v = N * (1 - (1 - u) * (1 - u));
        for (const r of reels) {
          const q = v / Math.pow(10, r.k);
          let pos = Math.floor(q) % 10;
          if (r.k === 0) pos = q % 10;
          else pos += Math.min(1, Math.max(0, ((v / Math.pow(10, r.k - 1)) % 10) - 9));
          r.strip.style.transform = "translateY(" + (-pos * 250).toFixed(2) + "px)";
          r.reel.style.opacity = r.k > 0 && q < 1 ? 0.3 : 1;
        }
      }
      tl.fromTo("#dogs-num", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power4.out" }, T0 + 0.9);
      tl.fromTo("#dogs-sub", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power4.out" }, T0 + 1.0);
      // « + de » claps on when the roll stops
      tl.fromTo("#dogs-prefix", { scale: 0.2, rotation: -16, opacity: 0 }, { scale: 1, rotation: -4, opacity: 1, duration: 0.35, ease: "back.out(2)" }, ROLL0 + ROLL);
      // the whole line slides up and out
      tl.fromTo("#dogs-block", { y: 0 }, { y: -560, duration: 0.3, ease: "power3.in" }, T0 + 3.9);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
