<!doctype html>
<html lang="fr" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- GSAP 3.14.2 kept locally (same version the other films load from jsDelivr) -->
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0d1230; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      svg.layer { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .drop { position: absolute; left: 0; top: 0; border-radius: 50%; background: radial-gradient(circle at 34% 30%, #fff3e6 0 14%, #b0753f 16% 100%); border: 5px solid #0a0b0d; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2" data-fps="60" data-width="1920" data-height="1080">
      <!-- plan A (night blue): the poop falls and splats at 0.5 s -->
      <div id="plan-a" class="clip" data-composition-id="plan-a" data-composition-src="compositions/plan-a.html" data-start="0" data-duration="1" data-track-index="0" data-width="1920" data-height="1080" style="z-index:1"></div>
      <!-- plan B (turquoise): uncovered by the hole in the brown from 1.0 s -->
      <div id="plan-b" class="clip" data-composition-id="plan-b" data-composition-src="compositions/plan-b.html" data-start="1" data-duration="1" data-track-index="1" data-width="1920" data-height="1080" style="z-index:1"></div>
      <!-- the brown wave rolling out of the splat; covers the whole frame from ~0.93 s, hard cut at 1.0 s -->
      <svg id="wave" class="layer clip" viewBox="0 0 1920 1080" data-start="0.5" data-duration="0.5" data-track-index="2" data-layout-allow-overflow style="z-index:3">
        <path id="wave-lead" fill="#b0753f" />
        <path id="wave-body" fill="#6b3f1d" />
        <path id="wave-core" fill="#8a5326" />
      </svg>
      <!-- the same brown, holed open from the centre onto plan B -->
      <svg id="open" class="layer clip" viewBox="0 0 1920 1080" data-start="1" data-duration="0.7" data-track-index="2" data-layout-allow-overflow style="z-index:3">
        <defs>
          <mask id="hole" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
            <rect width="1920" height="1080" fill="#fff" />
            <path id="hole-shape" fill="#000" />
          </mask>
        </defs>
        <g mask="url(#hole)">
          <rect width="1920" height="1080" fill="#8a5326" />
          <path id="hole-rim" fill="#6b3f1d" />
        </g>
      </svg>
      <!-- splash droplets fly over the wave -->
      <div id="drops" class="clip" data-start="0.5" data-duration="0.5" data-track-index="3" data-layout-allow-overflow style="position:absolute;inset:0;z-index:4"></div>

      <!-- sound: each clip starts so its peak lands on the image (onsets measured with outils/peaks.mjs) -->
      <audio id="sfx-fall" src="assets/sfx/whoosh-short.mp3" data-start="0.24" data-duration="0.575" data-volume="0.5" data-track-index="10"></audio>
      <audio id="sfx-splat" src="assets/sfx/impact-bass-1.mp3" data-start="0.43" data-duration="1.57" data-volume="0.6" data-track-index="11"></audio>
      <audio id="sfx-open" src="assets/sfx/pop-lo.wav" data-start="0.88" data-duration="0.768" data-volume="0.5" data-track-index="12"></audio>
    </div>
    <script>
      (function () {
        const CX = 960, CY = 540, HIT = 0.5;
        // wobbly blob of base radius 100 around the centre; its smallest radius is 88, so it covers the corners (1101 px) from scale 12.5
        function blob(phase) {
          let d = "";
          for (let i = 0; i <= 180; i++) {
            const t = (i / 180) * Math.PI * 2;
            const r = 100 * (1 + 0.06 * Math.sin(5 * t + phase) + 0.035 * Math.sin(9 * t + 1.3 * phase) + 0.02 * Math.sin(14 * t + 0.7));
            d += (i ? "L" : "M") + (CX + r * Math.cos(t)).toFixed(1) + " " + (CY + r * Math.sin(t)).toFixed(1);
          }
          return d + "Z";
        }
        [["wave-lead", 0.4], ["wave-body", 1.9], ["wave-core", 3.1], ["hole-shape", 2.5], ["hole-rim", 2.5]].forEach(([id, p]) => document.getElementById(id).setAttribute("d", blob(p)));

        // droplets: fixed angle (deg), distance and size, no randomness
        const D = [[200, 420, 64], [235, 360, 48], [262, 470, 76], [290, 380, 44], [318, 450, 68], [340, 340, 52], [158, 320, 46], [20, 300, 50], [182, 280, 36], [358, 290, 40]];
        const drops = document.getElementById("drops");
        const els = D.map(([, , size], i) => {
          const el = document.createElement("div");
          el.className = "drop";
          el.id = "drop-" + i;
          el.style.width = el.style.height = size + "px";
          return drops.appendChild(el);
        });

        const tl = gsap.timeline({ paused: true });
        const O = { svgOrigin: CX + " " + CY };
        const at = (a, b) => Object.assign(a, O, b || {});

        // 0.5–1.0 s: light, dark, then the poop's own #8a5326, which reaches the corners last (~0.93 s)
        tl.fromTo("#wave-lead", at({ scale: 0.4, rotation: 0 }), at({ scale: 15, rotation: 30 }, { duration: 0.34, ease: "power2.out" }), HIT + 0.08);
        tl.fromTo("#wave-body", at({ scale: 0.3, rotation: 0 }), at({ scale: 14.5, rotation: -24 }, { duration: 0.36, ease: "power2.out" }), HIT + 0.11);
        tl.fromTo("#wave-core", at({ scale: 0.1, rotation: 0 }), at({ scale: 14, rotation: 36 }, { duration: 0.33, ease: "power2.in" }), HIT + 0.11);

        // droplets: up and out of the splat, then gravity
        D.forEach(([deg, dist, size], i) => {
          const a = (deg * Math.PI) / 180;
          const x0 = CX - size / 2, y0 = CY + 100 - size / 2, y1 = y0 + dist * Math.sin(a);
          tl.fromTo(els[i], { x: x0, y: y0, scale: 0.4 }, { x: x0 + dist * Math.cos(a) * 1.5, y: y1, scale: 1, duration: 0.24, ease: "power2.out" }, HIT);
          tl.fromTo(els[i], { y: y1, opacity: 1 }, { y: y1 + 160, opacity: 0, duration: 0.24, ease: "power2.in", immediateRender: false }, HIT + 0.24);
        });

        // 1.0–1.6 s: the brown opens from the centre onto plan B, a dark rim just ahead of the hole
        tl.fromTo("#hole-shape", at({ scale: 0, rotation: 0 }), at({ scale: 13.5, rotation: -40 }, { duration: 0.6, ease: "power3.in" }), 1.0);
        tl.fromTo("#hole-rim", at({ scale: 0, rotation: 0 }), at({ scale: 15, rotation: -40 }, { duration: 0.6, ease: "power3.in" }), 1.0);

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
